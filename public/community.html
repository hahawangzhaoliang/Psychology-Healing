<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="community.page_title">微光社区 — 心晴空间</title>

    <meta name="description" content="匿名树洞、主题打卡、鼓励卡片，在这里分享温暖，接收温暖。">
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 神经美学设计系统 -->
    <link rel="stylesheet" href="css/neuroaesthetics.css">
    <link rel="stylesheet" href="css/icons-custom.css">
    <script src="js/cache.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ---------- 页面级覆盖 ---------- */
        body {
            font-family: var(--font-sans);
            background: var(--theme-bg);
            color: var(--theme-text);
        }

        /* ---------- 页面头部区域 ---------- */
        .page-hero {
            background: linear-gradient(160deg, var(--color-heal-50) 0%, var(--color-primary-50) 100%);
            padding-top: 80px;
            padding-bottom: 2.5rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        /* 装饰性光晕 */
        .page-hero::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--color-heal-100), transparent 60%);
            opacity: 0.2;
            top: -150px;
            right: -100px;
            animation: float 8s ease-in-out infinite;
            pointer-events: none;
        }

        /* ---------- 标签页切换 ---------- */
        .tab-bar {
            display: inline-flex;
            background: var(--theme-card);
            border-radius: var(--radius-full);
            padding: 4px;
            box-shadow: var(--shadow-sm);
        }
        .tab-btn {
            padding: 0.5rem 1.5rem;
            border-radius: var(--radius-full);
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--theme-text-light);
            background: transparent;
            border: none;
            cursor: pointer;
            transition: all var(--duration-normal) var(--ease-spring);
            white-space: nowrap;
        }
        .tab-btn:hover {
            color: var(--color-primary-500);
            background: var(--color-primary-50);
        }
        .tab-btn.active {
            background: linear-gradient(135deg, var(--color-primary-400), var(--color-primary-500));
            color: white;
            box-shadow: 0 4px 16px rgba(90, 154, 138, 0.3);
        }

        /* ---------- 主内容区域 ---------- */
        .main-content {
            max-width: 64rem;
            margin: 0 auto;
            padding: 2rem 1.5rem 3rem;
        }

        @media (min-width: 640px) {
            .main-content {
                padding: 3rem 2rem;
            }
        }

        /* ---------- 发布卡片 ---------- */
        .post-compose {
            background: var(--theme-card);
            border-radius: var(--radius-xl);
            padding: 1.5rem;
            box-shadow: var(--shadow-sm);
            margin-bottom: 1.5rem;
            transition: box-shadow var(--duration-normal) var(--ease-standard);
        }
        .post-compose:focus-within {
            box-shadow: var(--shadow-md);
        }

        .compose-header {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }
        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            flex-shrink: 0;
        }
        .compose-textarea {
            flex: 1;
            border: 2px solid transparent;
            border-radius: var(--radius-lg);
            padding: 0.75rem 1rem;
            font-family: var(--font-sans);
            font-size: 0.95rem;
            color: var(--theme-text);
            background: var(--theme-bg);
            resize: none;
            min-height: 80px;
            outline: none;
            transition: border-color var(--duration-fast) var(--ease-standard),
                        background var(--duration-fast) var(--ease-standard);
        }
        .compose-textarea:focus {
            border-color: var(--color-primary-200);
            background: var(--theme-card);
        }
        .compose-textarea::placeholder {
            color: var(--theme-text-light);
            opacity: 0.6;
        }

        .compose-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.75rem;
        }
        .mood-tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .mood-tag {
            padding: 0.25rem 0.75rem;
            border-radius: var(--radius-full);
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all var(--duration-fast) var(--ease-spring);
        }
        .mood-tag:hover {
            transform: scale(1.05);
        }
        .mood-tag.selected {
            color: white;
        }

        /* ---------- 帖子卡片 ---------- */
        .post-card {
            background: var(--theme-card);
            border-radius: var(--radius-xl);
            padding: 1.5rem;
            box-shadow: var(--shadow-xs);
            margin-bottom: 1rem;
            border: 1px solid transparent;
            transition: transform var(--duration-normal) var(--ease-spring),
                        box-shadow var(--duration-normal) var(--ease-standard),
                        border-color var(--duration-normal) var(--ease-standard);
            opacity: 0;
            transform: translateY(12px);
        }
        .post-card.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .post-card:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--color-primary-100);
        }

        .post-header {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
        }
        .post-meta {
            flex: 1;
        }
        .post-author {
            font-size: 0.85rem;
            color: var(--theme-text);
            font-weight: 500;
        }
        .post-time {
            font-size: 0.75rem;
            color: var(--theme-text-light);
        }
        .post-content {
            font-size: 0.95rem;
            color: var(--theme-text);
            line-height: 1.8;
            margin-bottom: 1rem;
        }
        .post-actions {
            display: flex;
            gap: 1.25rem;
        }
        .action-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            font-size: 0.85rem;
            color: var(--theme-text-light);
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.375rem 0.5rem;
            border-radius: var(--radius-md);
            transition: all var(--duration-fast) var(--ease-standard);
        }
        .action-btn:hover {
            background: var(--color-primary-50);
            color: var(--color-primary-500);
        }
        .action-btn.encourage:hover {
            background: #FCE7F3;
            color: #9D174D;
        }

        /* ---------- 打卡卡片 ---------- */
        .checkin-hero {
            background: linear-gradient(135deg, var(--color-primary-400), var(--color-primary-500));
            border-radius: var(--radius-xl);
            padding: 1.75rem;
            color: white;
            margin-bottom: 1.5rem;
            position: relative;
            overflow: hidden;
        }
        .checkin-hero::after {
            content: '';
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            top: -60px;
            right: -60px;
        }
        .streak-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(8px);
            padding: 0.375rem 1rem;
            border-radius: var(--radius-full);
            font-size: 0.85rem;
            font-weight: 600;
        }
        .checkin-hero h2 {
            font-size: 1.25rem;
            font-weight: 700;
            margin-top: 0.75rem;
            margin-bottom: 0.375rem;
        }
        .checkin-hero p {
            font-size: 0.875rem;
            opacity: 0.9;
            margin-bottom: 1rem;
        }
        .checkin-btn {
            width: 100%;
            padding: 0.75rem;
            border-radius: var(--radius-full);
            background: white;
            color: var(--color-primary-500);
            font-weight: 600;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            transition: all var(--duration-fast) var(--ease-spring);
        }
        .checkin-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }

        /* ---------- 打卡日历 ---------- */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0.375rem;
        }
        .calendar-day {
            aspect-ratio: 1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: var(--theme-text-light);
        }
        .calendar-day.checked {
            background: var(--color-primary-400);
            color: white;
            font-weight: 600;
        }
        .calendar-day.today {
            border: 2px solid var(--color-primary-400);
            color: var(--color-primary-500);
            font-weight: 600;
        }

        /* ---------- 打卡记录列表 ---------- */
        .checkin-record {
            border-left: 3px solid var(--color-primary-300);
            padding-left: 1rem;
            margin-bottom: 1.25rem;
        }
        .checkin-record-date {
            font-size: 0.8rem;
            color: var(--theme-text-light);
            margin-bottom: 0.375rem;
        }
        .checkin-record ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }
        .checkin-record li {
            font-size: 0.9rem;
            color: var(--theme-text);
            display: flex;
            align-items: center;
            gap: 0.375rem;
        }

        /* ---------- 模态框 ---------- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 300;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--duration-normal) var(--ease-standard);
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-card {
            background: var(--theme-card);
            border-radius: var(--radius-xl);
            padding: 2rem;
            max-width: 360px;
            width: 100%;
            text-align: center;
            transform: scale(0.88) translateY(16px);
            transition: transform var(--duration-normal) var(--ease-spring);
        }
        .modal-overlay.active .modal-card {
            transform: scale(1) translateY(0);
        }
        .modal-emoji {
            font-size: 3.5rem;
            display: block;
            margin-bottom: 1rem;
        }
        .modal-card h3 {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--theme-text);
            margin-bottom: 0.5rem;
        }
        .modal-card p {
            font-size: 0.9rem;
            color: var(--theme-text-light);
            margin-bottom: 1.25rem;
        }
        .encourage-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
            margin-bottom: 1rem;
        }
        .encourage-option {
            padding: 0.75rem;
            border-radius: var(--radius-lg);
            border: 2px solid var(--theme-border);
            background: transparent;
            cursor: pointer;
            transition: all var(--duration-fast) var(--ease-spring);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
        }
        .encourage-option:hover {
            border-color: var(--color-primary-300);
            background: var(--color-primary-50);
            transform: scale(1.03);
        }
        .encourage-option .icon {
            font-size: 1.75rem;
        }
        .encourage-option .label {
            font-size: 0.8rem;
            color: var(--theme-text);
        }
        .cancel-btn {
            width: 100%;
            padding: 0.625rem;
            border-radius: var(--radius-lg);
            background: var(--theme-bg);
            border: none;
            color: var(--theme-text-light);
            font-size: 0.9rem;
            cursor: pointer;
            transition: background var(--duration-fast) var(--ease-standard);
        }
        .cancel-btn:hover {
            background: var(--color-primary-50);
        }

        /* ---------- 打卡模态框 ---------- */
        .checkin-modal .modal-card {
            max-width: 400px;
        }
        .checkin-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid var(--theme-border);
            border-radius: var(--radius-md);
            font-family: var(--font-sans);
            font-size: 0.95rem;
            margin-bottom: 0.75rem;
            outline: none;
            transition: border-color var(--duration-fast) var(--ease-standard);
        }
        .checkin-input:focus {
            border-color: var(--color-primary-400);
        }
        .checkin-input::placeholder {
            color: var(--theme-text-light);
            opacity: 0.6;
        }
        .checkin-submit {
            width: 100%;
            padding: 0.75rem;
            border-radius: var(--radius-full);
            background: linear-gradient(135deg, var(--color-primary-400), var(--color-primary-500));
            color: white;
            font-weight: 600;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            transition: all var(--duration-fast) var(--ease-spring);
        }
        .checkin-submit:hover {
            box-shadow: 0 4px 16px rgba(90, 154, 138, 0.35);
            transform: scale(1.02);
        }

        /* ---------- 隐藏类 ---------- */
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        /* ---------- 话题筛选按钮 ---------- */
        .topic-filter {
            padding: 0.375rem 0.875rem;
            border-radius: var(--radius-full);
            font-size: 0.8rem;
            font-weight: 500;
            border: 1.5px solid var(--theme-border);
            background: var(--theme-card);
            color: var(--theme-text-light);
            cursor: pointer;
            transition: all var(--duration-fast) var(--ease-spring);
        }
        .topic-filter:hover {
            border-color: var(--color-primary-300);
            color: var(--color-primary-500);
        }
        .topic-filter.active {
            background: var(--color-primary-400);
            border-color: var(--color-primary-400);
            color: white;
        }

        /* ---------- 主题打卡切换 ---------- */
        .theme-selector {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }
        .theme-option {
            flex: 1;
            min-width: 140px;
            padding: 1rem;
            border-radius: var(--radius-lg);
            border: 2px solid var(--theme-border);
            background: var(--theme-card);
            cursor: pointer;
            transition: all var(--duration-fast) var(--ease-spring);
            text-align: center;
        }
        .theme-option:hover {
            border-color: var(--color-primary-300);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }
        .theme-option.active {
            border-color: var(--color-primary-400);
            background: var(--color-primary-50);
        }
        .theme-option .theme-emoji {
            font-size: 1.75rem;
            display: block;
            margin-bottom: 0.375rem;
        }
        .theme-option .theme-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--theme-text);
            display: block;
            margin-bottom: 0.25rem;
        }
        .theme-option .theme-desc {
            font-size: 0.7rem;
            color: var(--theme-text-light);
        }

        /* ---------- 鼓励卡动画 ---------- */
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            50% { opacity: 1; transform: translateY(-20px) scale(1.1); }
            100% { opacity: 0; transform: translateY(-40px) scale(0.8); }
        }
        .encourage-float {
            position: fixed;
            font-size: 2rem;
            pointer-events: none;
            z-index: 999;
            animation: floatUp 1.5s ease-out forwards;
        }

        /* ---------- 帖子话题标签 ---------- */
        .post-topic-tag {
            display: inline-block;
            padding: 0.125rem 0.5rem;
            border-radius: var(--radius-full);
            font-size: 0.7rem;
            font-weight: 500;
        }

        /* ---------- 页脚 ---------- */
        .site-footer {
            background: var(--theme-card);
            border-top: 1px solid var(--theme-border);
            padding: 2rem 1rem;
        }
        .site-footer .inner {
            max-width: 72rem;
            margin: 0 auto;
        }
        .site-footer .copyright {
            text-align: center;
            font-size: 0.8rem;
            color: var(--theme-text-light);
        }
    </style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden">
  <symbol id="icon-home" viewBox="0 0 48 48">
    <!-- 小房子 + 心形窗户 -->
    <path d="M24 6 L6 22 L10 22 L10 40 L38 40 L38 22 L42 22 Z"
          fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- 门 -->
    <path d="M19 40 L19 30 Q24 27 29 30 L29 40"
          fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    <!-- 屋顶小装饰（叶子） -->
    <path d="M24 6 Q20 2 16 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  </symbol>
  <symbol id="icon-emotion" viewBox="0 0 48 48">
    <!-- 脸 -->
    <circle cx="24" cy="24" r="18" fill="none" stroke="currentColor" stroke-width="2.2"/>
    <!-- 眼睛：弯弯的笑眼 -->
    <path d="M16 20 Q18 16 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <path d="M28 20 Q30 16 32 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <!-- 嘴巴：微笑弧线 -->
    <path d="M17 29 Q24 36 31 29" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    <!-- 脸颊红晕（用两个小弧表示） -->
    <path d="M13 25 Q12 28 14 27" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    <path d="M34 25 Q35 28 33 27" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  </symbol>
  <symbol id="icon-flow" viewBox="0 0 48 48">
    <!-- 水波纹扩散，表示心流状态 -->
    <circle cx="24" cy="24" r="5" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="24" cy="24" r="12" fill="none" stroke="currentColor" stroke-width="1.8" opacity="0.7"/>
    <circle cx="24" cy="24" r="18" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
    <!-- 中心小点 -->
    <circle cx="24" cy="24" r="2" fill="currentColor" opacity="0.8"/>
  </symbol>
  <symbol id="icon-knowledge" viewBox="0 0 48 48">
    <!-- 节点连接图，表示知识网络 -->
    <!-- 中心节点 -->
    <circle cx="24" cy="18" r="5" fill="none" stroke="currentColor" stroke-width="2.2"/>
    <!-- 左下节点 -->
    <circle cx="14" cy="34" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
    <!-- 右下节点 -->
    <circle cx="34" cy="34" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
    <!-- 连接线（柔和曲线） -->
    <path d="M22 22 Q20 28 16 31" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>
    <path d="M26 22 Q28 28 32 31" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>
    <path d="M20 18 Q24 15 28 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>
    <!-- 小装饰：中心节点内的小点 -->
    <circle cx="24" cy="18" r="1.5" fill="currentColor" opacity="0.5"/>
  </symbol>
  <symbol id="icon-community" viewBox="0 0 48 48">
    <!-- 两个人物，手拉手 -->
    <!-- 左边人物 -->
    <circle cx="17" cy="18" r="5" fill="none" stroke="currentColor" stroke-width="2"/>
    <path d="M10 46 Q10 30 17 28 Q24 30 24 46" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <!-- 右边人物 -->
    <circle cx="31" cy="18" r="5" fill="none" stroke="currentColor" stroke-width="2"/>
    <path d="M24 46 Q24 30 31 28 Q38 30 38 46" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <!-- 手拉手（弧线） -->
    <path d="M22 22 Q24 26 26 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>
  <symbol id="icon-cat" viewBox="0 0 48 48">
    <!-- 猫头 -->
    <path d="M14 20 Q10 8 20 12 Q24 6 28 12 Q38 8 34 20"
          fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- 猫脸 -->
    <circle cx="24" cy="26" r="11" fill="none" stroke="currentColor" stroke-width="2.2"/>
    <!-- 眼睛 -->
    <ellipse cx="20" cy="24" rx="2" ry="2.5" fill="currentColor"/>
    <ellipse cx="28" cy="24" rx="2" ry="2.5" fill="currentColor"/>
    <!-- 鼻子 -->
    <path d="M24 27 L22.5 29 L25.5 29 Z" fill="currentColor"/>
    <!-- 嘴巴 -->
    <path d="M22.5 29 Q24 32 25.5 29" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <!-- 胡须 -->
    <path d="M15 26 Q12 25 13 23" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M15 28 Q12 29 13 31" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M33 26 Q36 25 35 23" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M33 28 Q36 29 35 31" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  </symbol>
  <symbol id="icon-settings" viewBox="0 0 48 48">
    <!-- 齿轮，但用柔和线条 -->

    <script>
        /* ========== i18n 辅助函数 ========== */
        function _t(key, zhDefault) {
            if (!window.I18N) return zhDefault || key;
            if (I18N.currentLocale === 'zh-CN') return zhDefault || key;
            return I18N.t(key) || zhDefault || key;
        }

        /* ========== 状态 ========== */
        let currentTab = 'treehole';
        let currentPostId = null;
        let selectedMood = null;
        let currentTopic = 'all';

        /* ========== 匿名身份系统 ========== */
        const ANON_IDENTITIES = [
            { emoji: '🌟', nameKey: 'community.anon_identity_0', nameZh: '微光旅人' },
            { emoji: '🌙', nameKey: 'community.anon_identity_1', nameZh: '深夜旅人' },
            { emoji: '🍃', nameKey: 'community.anon_identity_2', nameZh: '清风过客' },
            { emoji: '🌈', nameKey: 'community.anon_identity_3', nameZh: '彩虹拾光者' },
            { emoji: '🕊️', nameKey: 'community.anon_identity_4', nameZh: '自由飞鸟' },
            { emoji: '🌸', nameKey: 'community.anon_identity_5', nameZh: '春日使者' },
            { emoji: '🦋', nameKey: 'community.anon_identity_6', nameZh: '蝴蝶旅人' },
            { emoji: '🌊', nameKey: 'community.anon_identity_7', nameZh: '海岸漫游者' },
            { emoji: '🍀', nameKey: 'community.anon_identity_8', nameZh: '幸运旅人' },
            { emoji: '⛰️', nameKey: 'community.anon_identity_9', nameZh: '山间行者' },
            { emoji: '🌻', nameKey: 'community.anon_identity_10', nameZh: '向阳旅人' },
            { emoji: '❄️', nameKey: 'community.anon_identity_11', nameZh: '雪夜归人' },
        ];

        function getCurrentAnonIdentity() {
            const saved = localStorage.getItem('anonIdentity');
            if (saved) {
                const idx = parseInt(saved);
                return ANON_IDENTITIES[idx] || ANON_IDENTITIES[0];
            }
            return ANON_IDENTITIES[0];
        }

        function changeAnonymousId() {
            const current = getCurrentAnonIdentity();
            const currentIdx = ANON_IDENTITIES.indexOf(current);
            const nextIdx = (currentIdx + 1) % ANON_IDENTITIES.length;
            localStorage.setItem('anonIdentity', nextIdx.toString());
            const next = ANON_IDENTITIES[nextIdx];
            document.getElementById('anon-emoji').textContent = next.emoji;
            document.getElementById('anon-name').textContent = _t(next.nameKey, next.nameZh);
            document.getElementById('compose-avatar').textContent = next.emoji;
        }

        function initAnonIdentity() {
            const identity = getCurrentAnonIdentity();
            document.getElementById('anon-emoji').textContent = identity.emoji;
            document.getElementById('anon-name').textContent = _t(identity.nameKey, identity.nameZh);
            document.getElementById('compose-avatar').textContent = identity.emoji;
        }

        /* ========== 示例帖子数据 ========== */
        const samplePosts = [
            { id: 1, content: '今天工作压力很大，但是下班后看到了美丽的晚霞，突然觉得一切都值得了。', mood: 'calm', timestamp: new Date(Date.now() - 3600000).toISOString(), encouragements: 12, replies: 3 },
            { id: 2, content: '终于完成了那个困扰我很久的项目，虽然过程很艰难，但是成长了很多。', mood: 'joy', timestamp: new Date(Date.now() - 7200000).toISOString(), encouragements: 8, replies: 2 },
            { id: 3, content: '有时候觉得自己很渺小，但是想到还有人在默默支持我，就觉得很温暖。', mood: 'anxious', timestamp: new Date(Date.now() - 10800000).toISOString(), encouragements: 15, replies: 5 },
            { id: 4, content: '今天和家人吃了一顿很久没吃的团圆饭，聊了很多以前的事，感觉心里暖暖的。', mood: 'grateful', timestamp: new Date(Date.now() - 14400000).toISOString(), encouragements: 22, replies: 7 },
            { id: 5, content: '最近有点迷茫，不知道自己想要什么。但至少今天好好吃了一顿饭，善待了自己。', mood: 'sad', timestamp: new Date(Date.now() - 18000000).toISOString(), encouragements: 18, replies: 4 },
        ];

        const moodConfig = {
            joy:      { emoji: '😊', tagKey: 'community.mood_tag_joy',      tagZh: '😊 开心',   bg: '#FEF3C7', color: '#92400E' },
            calm:     { emoji: '😌', tagKey: 'community.mood_tag_calm',     tagZh: '😌 平静',   bg: '#DBEAFE', color: '#1E40AF' },
            anxious:  { emoji: '😰', tagKey: 'community.mood_tag_anxious',  tagZh: '😰 焦虑',   bg: '#E9D5FF', color: '#6B21A8' },
            sad:      { emoji: '😢', tagKey: 'community.mood_tag_sad',      tagZh: '😢 难过',   bg: '#E0E7FF', color: '#3730A3' },
            grateful: { emoji: '🙏', tagKey: 'community.mood_tag_grateful', tagZh: '🙏 感恩',   bg: '#FEE2E2', color: '#991B1B' },
        };

        /* ========== 打卡主题配置 ========== */
        const CHECKIN_THEMES = [
            { id: 'happiness', emoji: '✨', nameKey: 'community.theme_happiness_name', nameZh: '每日三件小确幸', descKey: 'community.theme_happiness_desc', descZh: '记录今天让你感到幸福的三件小事', inputLabelKeys: ['community.theme_happiness_label_1', 'community.theme_happiness_label_2', 'community.theme_happiness_label_3'], inputLabelsZh: ['第一件小确幸', '第二件小确幸', '第三件小确幸'] },
            { id: 'gratitude', emoji: '🙏', nameKey: 'community.theme_gratitude_name', nameZh: '感恩日记', descKey: 'community.theme_gratitude_desc', descZh: '写下今天你想感谢的人和事', inputLabelKeys: ['community.theme_gratitude_label_1', 'community.theme_gratitude_label_2', 'community.theme_gratitude_label_3'], inputLabelsZh: ['想感谢的人', '感谢的原因', '想对TA说的话'] },
            { id: 'progress', emoji: '🌱', nameKey: 'community.theme_progress_name', nameZh: '今日进步', descKey: 'community.theme_progress_desc', descZh: '记录今天你做到的一件事', inputLabelKeys: ['community.theme_progress_label_1', 'community.theme_progress_label_2', 'community.theme_progress_label_3'], inputLabelsZh: ['做到了什么', '过程中克服的困难', '给自己的鼓励'] },
            { id: 'emotion', emoji: '🌡️', nameKey: 'community.theme_emotion_name', nameZh: '情绪温度计', descKey: 'community.theme_emotion_desc', descZh: '今天你的心情几分？（1-10分）', inputLabelKeys: ['community.theme_emotion_label_1', 'community.theme_emotion_label_2', 'community.theme_emotion_label_3'], inputLabelsZh: ['今天的心情分数（1-10）', '最高兴的瞬间', '最想改善的事'] },
        ];

        /* ========== 标签页切换 ========== */
        function switchTab(tab) {
            currentTab = tab;

            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`[data-tab="${tab}"]`).classList.add('active');

            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');

            if (tab === 'treehole') {
                loadPosts();
            } else {
                loadCheckinData();
            }
        }

        /* ========== 心情标签 ========== */
        function addMood(btn, mood) {
            selectedMood = mood;
            const textarea = document.getElementById('post-content');
            const config = moodConfig[mood];

            /* 重置所有按钮 */
            document.querySelectorAll('.mood-tag').forEach(b => {
                const m = b.dataset.mood || '';
                const c = moodConfig[m] || {};
                b.style.background = c.bg || '';
                b.style.color = c.color || '';
                if (m) {
                    b.innerHTML = c.emoji ? `${c.emoji} ${_t(c.tagKey, c.tagZh)}` : b.innerText;
                }
            });

            /* 高亮选中按钮 */
            btn.style.background = config.bg;
            btn.style.color = 'white';
            btn.innerHTML = config.emoji + _t('community.mood_selected', ' 已选');

            /* 前缀文本（不重复添加） */
            const tagPrefix = _t(config.tagKey, config.tagZh);
            if (!textarea.value.startsWith(config.emoji)) {
                textarea.value = tagPrefix + ' ' + textarea.value;
            }
        }

        /* ========== 话题筛选 ========== */
        function filterPosts(topic) {
            currentTopic = topic;
            document.querySelectorAll('.topic-filter').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.topic === topic);
            });
            loadPosts();
        }

        /* ========== 发布帖子 ========== */
        function submitPost() {
            const content = document.getElementById('post-content').value.trim();
            if (!content) {
                showToast(_t('community.toast_post_empty', '请输入内容'), 'warning');
                return;
            }

            const post = {
                id: Date.now(),
                content,
                mood: selectedMood || 'calm',
                timestamp: new Date().toISOString(),
                encouragements: 0,
                replies: 0,
            };

            const posts = JSON.parse(localStorage.getItem('communityPosts') || '[]');
            posts.unshift(post);
            localStorage.setItem('communityPosts', JSON.stringify(posts));

            document.getElementById('post-content').value = '';
            selectedMood = null;

            /* 重置心情标签 */
            document.querySelectorAll('.mood-tag').forEach(b => {
                const m = b.dataset.mood || '';
                const c = moodConfig[m] || {};
                b.style.background = c.bg || '';
                b.style.color = c.color || '';
                if (m) {
                    b.innerHTML = c.emoji ? `${c.emoji} ${_t(c.tagKey, c.tagZh)}` : b.innerText;
                }
            });

            loadPosts();
            showToast(_t('community.toast_post_success', '发布成功，感谢你的分享 💝'), 'success');
        }

        /* ========== 加载帖子 ========== */
        function loadPosts() {
            const posts = JSON.parse(localStorage.getItem('communityPosts') || '[]');
            // 用户自己发的帖子用真实匿名身份，其他用样本身份
            const currentIdentity = getCurrentAnonIdentity();
            const postsWithIdentity = posts.map((post, idx) => ({
                ...post,
                _identity: currentIdentity,
            }));
            const allPosts = [...postsWithIdentity, ...samplePosts];

            // 话题筛选
            const filtered = currentTopic === 'all'
                ? allPosts
                : allPosts.filter(p => p.mood === currentTopic);

            const container = document.getElementById('posts-container');

            const topicLabels = {
                all:      _t('community.filter_all', '全部'),
                joy:      _t('community.filter_joy', '开心'),
                calm:     _t('community.filter_calm', '平静'),
                anxious:  _t('community.filter_anxious', '焦虑'),
                sad:      _t('community.filter_sad', '难过'),
                grateful: _t('community.filter_grateful', '感恩'),
            };

            if (filtered.length === 0) {
                const template = _t('community.empty_no_topic', '暂时没有「{topic}」话题的帖子');
                const emptyMsg = currentTopic === 'all'
                    ? _t('community.empty_no_posts', '还没有帖子，成为第一个分享的人吧')
                    : template.replace('{topic}', topicLabels[currentTopic] || currentTopic);
                container.innerHTML = `
                    <div style="text-align:center;padding:3rem 1rem;color:var(--theme-text-light);">
                        <div style="font-size:3rem;opacity:0.6;margin-bottom:1rem;">🌳</div>
                        <p>${emptyMsg}</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map((post, i) => {
                const mood = moodConfig[post.mood] || moodConfig.calm;
                const isUserPost = posts.some(p => p.id === post.id);
                const identity = isUserPost ? currentIdentity : ANON_IDENTITIES[post.id % ANON_IDENTITIES.length];
                return `
                    <article class="post-card" style="transition-delay:${i * 60}ms;" data-post-id="${post.id}">
                        <div class="post-header">
                            <div class="avatar" style="background:linear-gradient(135deg,${mood.bg},${mood.color}30);font-size:1.1rem;">${identity.emoji}</div>
                            <div class="post-meta">
                                <div class="post-author">${_t(identity.nameKey, identity.nameZh)}</div>
                                <div class="post-time">${getTimeAgo(post.timestamp)}</div>
                            </div>
                            <span class="post-topic-tag" style="background:${mood.bg}20;color:${mood.color};">${topicLabels[post.mood] || post.mood}</span>
                        </div>
                        <p class="post-content">${escapeHtml(post.content)}</p>
                        <div class="post-actions">
                            <button class="action-btn encourage" onclick="showEncourageModal(${post.id})">
                                <span>💝</span>
                                <span>${post.encouragements}</span>
                            </button>
                            <button class="action-btn" onclick="toggleReplies(${post.id})">
                                <span>💬</span>
                                <span>${post.replies}</span>
                            </button>
                        </div>
                    </article>
                `;
            }).join('');

            /* 触发动画 */
            requestAnimationFrame(() => {
                document.querySelectorAll('.post-card').forEach((card, i) => {
                    setTimeout(() => card.classList.add('visible'), i * 60);
                });
            });
        }

        /* ========== 鼓励模态框 ========== */
        function showEncourageModal(postId) {
            currentPostId = postId;
            document.getElementById('encourageModal').classList.add('active');
        }

        function closeEncourageModal() {
            document.getElementById('encourageModal').classList.remove('active');
            currentPostId = null;
        }

        function sendEncourage(type) {
            // 查找并更新点赞数
            const posts = JSON.parse(localStorage.getItem('communityPosts') || '[]');
            const post = posts.find(p => p.id === currentPostId);
            if (post) {
                post.encouragements++;
                localStorage.setItem('communityPosts', JSON.stringify(posts));
            }

            // 鼓励卡浮动动画
            const emojis = { hug: '🤗', star: '⭐', heart: '❤️', flower: '🌸' };
            const modal = document.getElementById('encourageModal');
            const rect = modal.querySelector(`.encourage-option:nth-child(${['hug','star','heart','flower'].indexOf(type)+1})`).getBoundingClientRect();
            const floater = document.createElement('div');
            floater.className = 'encourage-float';
            floater.textContent = emojis[type];
            floater.style.left = (rect.left + rect.width / 2 - 16) + 'px';
            floater.style.top = (rect.top + rect.height / 2 - 16) + 'px';
            document.body.appendChild(floater);
            setTimeout(() => floater.remove(), 1500);

            const messages = {
                hug:    _t('community.encourage_msg_hug', '你发送了一个温暖的拥抱 🤗'),
                star:   _t('community.encourage_msg_star', '你为TA点亮了一颗星 ⭐'),
                heart:  _t('community.encourage_msg_heart', '你送出了一颗爱心 ❤️'),
                flower: _t('community.encourage_msg_flower', '你送上了美好的祝福 🌸'),
            };

            closeEncourageModal();
            showToast(messages[type], 'success');
            loadPosts();
        }

        let currentCheckinTheme = CHECKIN_THEMES[0];

        /* ========== 打卡 ========== */
        function startCheckin() {
            const modal = document.getElementById('checkinModal');
            document.getElementById('checkin-modal-emoji').textContent = currentCheckinTheme.emoji;
            document.getElementById('checkin-modal-title').textContent = _t(currentCheckinTheme.nameKey, currentCheckinTheme.nameZh);
            document.getElementById('checkin-modal-desc').textContent = _t(currentCheckinTheme.descKey, currentCheckinTheme.descZh);
            // 设置输入框占位符
            const labelKeys = currentCheckinTheme.inputLabelKeys;
            const labelZh = currentCheckinTheme.inputLabelsZh;
            document.getElementById('checkin-input-1').placeholder = _t(labelKeys[0], labelZh[0]) + '...';
            document.getElementById('checkin-input-2').placeholder = _t(labelKeys[1], labelZh[1]) + '...';
            document.getElementById('checkin-input-3').placeholder = _t(labelKeys[2], labelZh[2]) + '...';
            modal.classList.add('active');
        }

        function closeCheckinModal() {
            document.getElementById('checkinModal').classList.remove('active');
            document.getElementById('checkin-input-1').value = '';
            document.getElementById('checkin-input-2').value = '';
            document.getElementById('checkin-input-3').value = '';
        }

        function submitCheckin() {
            const h1 = document.getElementById('checkin-input-1').value.trim();
            const h2 = document.getElementById('checkin-input-2').value.trim();
            const h3 = document.getElementById('checkin-input-3').value.trim();

            if (!h1 || !h2 || !h3) {
                const themeName = _t(currentCheckinTheme.nameKey, currentCheckinTheme.nameZh);
                showToast(_t('community.toast_checkin_empty', '请填写{theme}的三个内容').replace('{theme}', themeName), 'warning');
                return;
            }

            const checkin = {
                date: new Date().toISOString().split('T')[0],
                themeId: currentCheckinTheme.id,
                themeName: _t(currentCheckinTheme.nameKey, currentCheckinTheme.nameZh),
                items: [h1, h2, h3],
                timestamp: new Date().toISOString(),
            };

            const checkins = JSON.parse(localStorage.getItem('checkins') || '[]');
            // 检查今天是否已经打过这个主题的卡
            const today = new Date().toISOString().split('T')[0];
            const alreadyCheckedIn = checkins.some(c => c.date === today && c.themeId === currentCheckinTheme.id);
            if (alreadyCheckedIn) {
                const themeName = _t(currentCheckinTheme.nameKey, currentCheckinTheme.nameZh);
                showToast(_t('community.toast_checkin_duplicate', '今天已经完成过「{theme}」打卡了！明天再来吧 😊').replace('{theme}', themeName), 'info');
                closeCheckinModal();
                return;
            }

            checkins.push(checkin);
            localStorage.setItem('checkins', JSON.stringify(checkins));

            closeCheckinModal();
            showToast(_t('community.toast_checkin_success', '打卡成功，感谢记录今天的美好 💝'), 'success');
            loadCheckinData();
        }

        function renderThemeSelector() {
            const container = document.getElementById('theme-selector');
            container.innerHTML = CHECKIN_THEMES.map(theme => `
                <div class="theme-option ${theme.id === currentCheckinTheme.id ? 'active' : ''}"
                     onclick="selectCheckinTheme('${theme.id}')" data-theme-id="${theme.id}">
                    <span class="theme-emoji">${theme.emoji}</span>
                    <span class="theme-name">${_t(theme.nameKey, theme.nameZh)}</span>
                    <span class="theme-desc">${_t(theme.descKey, theme.descZh).substring(0, 15)}...</span>
                </div>
            `).join('');
        }

        function selectCheckinTheme(themeId) {
            const theme = CHECKIN_THEMES.find(t => t.id === themeId);
            if (!theme) return;
            currentCheckinTheme = theme;

            // 更新卡片显示
            document.getElementById('checkin-theme-name').textContent = _t(theme.nameKey, theme.nameZh);
            document.getElementById('checkin-theme-desc').textContent = _t(theme.descKey, theme.descZh);

            // 更新按钮样式
            document.querySelectorAll('.theme-option').forEach(el => {
                el.classList.toggle('active', el.dataset.themeId === themeId);
            });

            // 更新按钮文字
            const today = new Date().toISOString().split('T')[0];
            const checkins = JSON.parse(localStorage.getItem('checkins') || '[]');
            const alreadyDone = checkins.some(c => c.date === today && c.themeId === themeId);
            document.getElementById('checkin-btn').textContent = alreadyDone
                ? _t('community.toast_checkin_already_done', '✓ 今日已打卡')
                : _t('community.checkin_btn_start', '开始今日打卡');
            document.getElementById('checkin-btn').style.background = alreadyDone ? '#10B981' : 'white';
        }

        /* ========== 加载打卡数据 ========== */
        function loadCheckinData() {
            const checkins = JSON.parse(localStorage.getItem('checkins') || '[]');

            /* 计算连续天数 */
            let streak = 0;
            const today = new Date().toISOString().split('T')[0];
            const dates = checkins.map(c => c.date).reverse();

            for (let i = 0; i < dates.length; i++) {
                const expected = new Date();
                expected.setDate(expected.getDate() - i);
                const expectedStr = expected.toISOString().split('T')[0];
                if (dates.includes(expectedStr)) {
                    streak++;
                } else {
                    break;
                }
            }

            document.getElementById('streak-count').textContent = streak;

            /* 渲染主题选择器 */
            renderThemeSelector();
            selectCheckinTheme(currentCheckinTheme.id);

            /* 渲染日历 */
            renderCalendar(checkins);

            /* 渲染记录 */
            renderCheckinRecords(checkins);
        }

        function renderCalendar(checkins) {
            const calendar = document.getElementById('checkin-calendar');
            calendar.innerHTML = '';
            const today = new Date().toISOString().split('T')[0];
            const dates = checkins.map(c => c.date);
            const weekDays = [
                _t('community.weekday_0', '日'),
                _t('community.weekday_1', '一'),
                _t('community.weekday_2', '二'),
                _t('community.weekday_3', '三'),
                _t('community.weekday_4', '四'),
                _t('community.weekday_5', '五'),
                _t('community.weekday_6', '六'),
            ];

            /* 星期标题 */
            weekDays.forEach(d => {
                calendar.innerHTML += `<div class="calendar-day" style="font-weight:600;color:var(--theme-text-light);">${d}</div>`;
            });

            /* 日期格子 */
            for (let i = 29; i >= 0; i--) {
                const date = new Date();
                date.setDate(date.getDate() - i);
                const dateStr = date.toISOString().split('T')[0];
                const hasCheckin = dates.includes(dateStr);
                const isToday = dateStr === today;
                const dayNum = date.getDate();

                calendar.innerHTML += `
                    <div class="calendar-day ${hasCheckin ? 'checked' : ''} ${isToday ? 'today' : ''}">${dayNum}</div>
                `;
            }
        }

        function renderCheckinRecords(checkins) {
            const container = document.getElementById('checkin-records');

            if (checkins.length === 0) {
                container.innerHTML = `<p style="color:var(--theme-text-light);text-align:center;padding:2rem;">${_t('community.checkin_no_records', '还没有打卡记录，开始你的第一次打卡吧！')}</p>`;
                return;
            }

            container.innerHTML = checkins.slice(-10).reverse().map(checkin => {
                const date = new Date(checkin.date);
                const month = date.getMonth() + 1;
                const day = date.getDate();
                const dateStr = _t('community.month_format', '{month}/{n}').replace('{month}', month).replace('{n}', day);
                const theme = CHECKIN_THEMES.find(t => t.id === checkin.themeId) || { emoji: '📝', nameKey: 'community.theme_fallback', nameZh: '打卡' };
                const itemIcons = ['✨', '💫', '🌟'];
                return `
                    <div class="checkin-record">
                        <div class="checkin-record-date">${theme.emoji} ${_t(theme.nameKey, theme.nameZh)} · ${dateStr}</div>
                        <ul>
                            ${checkin.items.map((item, i) => `<li>${itemIcons[i] || '•'} ${escapeHtml(item)}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }).join('');
        }

        /* ========== 工具函数 ========== */
        function getTimeAgo(timestamp) {
            const diff = Math.floor((Date.now() - new Date(timestamp).getTime()) / 1000);
            if (diff < 60) return _t('community.time_just_now', '刚刚');
            if (diff < 3600) return _t('community.time_minutes_ago', '{n} 分钟前').replace('{n}', Math.floor(diff / 60));
            if (diff < 86400) return _t('community.time_hours_ago', '{n} 小时前').replace('{n}', Math.floor(diff / 3600));
            return _t('community.time_days_ago', '{n} 天前').replace('{n}', Math.floor(diff / 86400));
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function toggleReplies(postId) {
            showToast(_t('community.toast_reply_coming', '回复功能开发中...'), 'info');
        }

        function showToast(message, type = 'info') {
            const colors = { success: 'var(--color-primary-400)', info: 'var(--color-primary-500)', warning: '#F59E0B', error: '#EF4444' };
            const toast = document.createElement('div');
            toast.style.cssText = `position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(20px);background:${colors[type] || colors.info};color:white;padding:0.75rem 1.5rem;border-radius:9999px;font-size:0.95rem;z-index:9999;box-shadow:var(--shadow-lg);opacity:0;transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);pointer-events:none;white-space:nowrap;`;
            toast.textContent = message;
            document.body.appendChild(toast);
            requestAnimationFrame(() => {
                toast.style.opacity = '1';
                toast.style.transform = 'translateX(-50%) translateY(0)';
            });
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(-50%) translateY(20px)';
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        /* ========== 初始化 ========== */
        document.addEventListener('DOMContentLoaded', () => {
            initAnonIdentity(); // 初始化匿名身份
            loadPosts();

            /* ESC 关闭模态框 */
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeEncourageModal();
                    closeCheckinModal();
                }
            });

            /* 点击遮罩关闭 */
            document.getElementById('encourageModal').addEventListener('click', (e) => {
                if (e.target === document.getElementById('encourageModal')) closeEncourageModal();
            });
            document.getElementById('checkinModal').addEventListener('click', (e) => {
                if (e.target === document.getElementById('checkinModal')) closeCheckinModal();
            });
        });
    </script>

    <!-- 通用导航栏组件 -->
    <script src="js/components/header.js"></script>
    <script>
      renderHeader({ currentPage: 'community' });
    </script>
    <!-- 通用页脚组件 -->
    <script src="js/components/footer.js"></script>
    <script>
      renderFooter();
    </script>
