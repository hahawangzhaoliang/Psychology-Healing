<!--
  心晴空间 — 疗愈主题 SVG 图标集（扩展包）
  风格与 css/icons-custom.svg 完全一致：48×48 网格、currentColor 描边、有机曲线、圆角笔触。
  设计目标：情绪觉察 + 疗愈练习 + 支持与关怀，三个维度共 16 枚。

  使用方式（与主图标集相同）：
    1) 页面底部加载：script src="js/svg-loader.js" data-svg-sprite="css/icons-healing.svg"
    2) 页面内引用：svg 元素使用 use href="#icon-calm"
    3) 颜色由父级 color 决定；尺寸由 CSS 决定。

  预览：public/icons-healing-preview.html
  注意：本文件按 XML 解析，注释中不可出现连续两个半角连字符。
-->
<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden">

  <!-- ======================================================
       一、情绪与状态
       ====================================================== -->

  <!-- 平静 · 安详闭目的脸 -->
  <symbol id="icon-calm" viewBox="0 0 48 48">
    <circle cx="24" cy="24" r="17" fill="none" stroke="currentColor" stroke-width="2.2"/>
    <!-- 闭目：向下的柔和弧线 -->
    <path d="M15 21 Q18.5 24 22 21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <path d="M26 21 Q29.5 24 33 21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <!-- 浅浅的安详微笑 -->
    <path d="M19 30 Q24 34 29 30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <!-- 焦虑 · 缠绕的线团 -->
  <symbol id="icon-anxiety" viewBox="0 0 48 48">
    <circle cx="24" cy="24" r="16" fill="none" stroke="currentColor" stroke-width="1.6" opacity="0.22"/>
    <path d="M14 17 Q24 9 33 16 Q42 23 33 31 Q24 39 15 32 Q8 26 15 21 Q22 16 29 22 Q35 27 29 32"
          fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  </symbol>

  <!-- 悲伤 · 落雨的云 -->
  <symbol id="icon-sadness" viewBox="0 0 48 48">
    <path d="M15 27 Q9 27 9 21.5 Q9 15.5 15 15.5 Q17 9.5 24 9.5 Q31 9.5 33 15.5 Q39 15 39 21.5 Q39 27 33 27 Z"
          fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M18 32 L16 37" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
    <path d="M24 32 L22 38" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <path d="M30 32 L28 37" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
  </symbol>

  <!-- 感恩 · 双手捧心 -->
  <symbol id="icon-gratitude" viewBox="0 0 48 48">
    <path d="M24 26 C20 22 17 19 17 15.5 C17 12.5 19 11 21 11 C22.4 11 23.5 12 24 13 C24.5 12 25.6 11 27 11 C29 11 31 12.5 31 15.5 C31 19 28 22 24 26 Z"
          fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M10 31 Q10 42 24 42 Q38 42 38 31" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M15 33 Q24 37 33 33" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  </symbol>

  <!-- 希望 · 破土新芽 -->
  <symbol id="icon-hope" viewBox="0 0 48 48">
    <path d="M24 41 Q23 34 24 27" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M24 32 Q17.5 30.5 15 24.5 Q22 23.5 24 29.5 Z"
          fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    <path d="M24 27 Q30.5 25 33 19 Q26 18.5 24 24 Z"
          fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    <path d="M12 41 Q24 36 36 41" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </symbol>

  <!-- ======================================================
       二、疗愈练习
       ====================================================== -->

  <!-- 冥想 · 盘坐人形 -->
  <symbol id="icon-meditation" viewBox="0 0 48 48">
    <circle cx="24" cy="12" r="4.6" fill="none" stroke="currentColor" stroke-width="2"/>
    <path d="M18.5 34 Q17 22 24 21 Q31 22 29.5 34 Z"
          fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    <path d="M18 25 Q12.5 28 11.5 33" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M30 25 Q35.5 28 36.5 33" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M10 36 Q24 30 38 36 Q24 42 10 36 Z"
          fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
  </symbol>

  <!-- 正念 · 正念铃 -->
  <symbol id="icon-mindfulness" viewBox="0 0 48 48">
    <circle cx="24" cy="11.5" r="2.6" fill="none" stroke="currentColor" stroke-width="2"/>
    <path d="M16 32 Q16 19 24 18 Q32 19 32 32 Z"
          fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M12 32 Q24 36 36 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M21.5 32 Q24 29 26.5 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="24" cy="36.5" r="2" fill="currentColor" fill-opacity="0.45"/>
  </symbol>

  <!-- 睡眠 · 月牙与睡意 -->
  <symbol id="icon-sleep" viewBox="0 0 48 48">
    <path d="M30.15 20.71 A10.35 10.35 0 1 1 18.89 9.45 A8.05 8.05 0 0 0 30.15 20.71 Z"
          fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M31 10 L39 10 L31 18 L39 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
    <path d="M33 22.5 L39.5 22.5 L33 29 L39.5 29" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>
  </symbol>

  <!-- 疗愈音乐 · 双音符 -->
  <symbol id="icon-music" viewBox="0 0 48 48">
    <path d="M20 34 L20 14 L34 11 L34 31" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="16" cy="34" rx="4.6" ry="3.6" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="2"/>
    <ellipse cx="30" cy="31" rx="4.6" ry="3.6" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="2"/>
  </symbol>

  <!-- 静心茶 · 一杯热茶 -->
  <symbol id="icon-tea" viewBox="0 0 48 48">
    <path d="M10 22 L36 22 L33 38 Q32.5 41 29 41 L17 41 Q13.5 41 13 38 Z"
          fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M36 25 Q42 26 42 30.5 Q42 35 36 35.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <path d="M19 17 Q17 14 19 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity="0.55"/>
    <path d="M25 17 Q23 13.5 25 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity="0.45"/>
    <path d="M31 17 Q29 14 31 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity="0.35"/>
  </symbol>

  <!-- 补水 · 水滴 -->
  <symbol id="icon-water" viewBox="0 0 48 48">
    <path d="M24 7 Q36 22 36 30 Q36 39.5 24 39.5 Q12 39.5 12 30 Q12 22 24 7 Z"
          fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M18.5 29 Q18.5 33.5 23 34.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.5"/>
  </symbol>

  <!-- ======================================================
       三、支持与关怀
       ====================================================== -->

  <!-- 拥抱 · 相拥的两个人 -->
  <symbol id="icon-hug" viewBox="0 0 48 48">
    <circle cx="18" cy="17" r="5" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="30" cy="17" r="5" fill="none" stroke="currentColor" stroke-width="2"/>
    <path d="M9 40 Q9 30 18 28 Q24 27 24 33" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <path d="M39 40 Q39 30 30 28 Q24 27 24 33" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <path d="M18 30 Q24 25.5 30 30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity="0.55"/>
    <path d="M24 10.5 C22.6 9.2 21.8 8.1 21.8 7 C21.8 6 22.5 5.4 23.2 5.4 C23.6 5.4 23.9 5.6 24 6 C24.1 5.6 24.4 5.4 24.8 5.4 C25.5 5.4 26.2 6 26.2 7 C26.2 8.1 25.4 9.2 24 10.5 Z"
          fill="currentColor" fill-opacity="0.5"/>
  </symbol>

  <!-- 倾听 · 耳朵与声波 -->
  <symbol id="icon-listen" viewBox="0 0 48 48">
    <path d="M29 10 Q18 10 17 21.5 Q16.6 27.5 20 29.5 Q22.6 31 22.6 34.5 Q22.6 39 27 39 Q31 39 31 35"
          fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M27 16 Q21.5 16 21 21.5 Q20.6 25.5 24 27 Q26.5 28 26.5 31.5"
          fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M35 17 Q38 21.5 35 26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.55"/>
    <path d="M38.5 14 Q43 21.5 38.5 29" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
  </symbol>

  <!-- 自我关怀 · 心与微光 -->
  <symbol id="icon-selfcare" viewBox="0 0 48 48">
    <path d="M24 40 C15 33 11 27.5 11 21.5 C11 16 15 13.5 18.5 13.5 C21 13.5 23 15 24 17 C25 15 27 13.5 29.5 13.5 C33 13.5 37 16 37 21.5 C37 27.5 33 33 24 40 Z"
          fill="currentColor" fill-opacity="0.10" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M37 7 L38.4 10.6 L42 12 L38.4 13.4 L37 17 L35.6 13.4 L32 12 L35.6 10.6 Z"
          fill="currentColor" fill-opacity="0.4"/>
  </symbol>

  <!-- 安全感 · 护盾与心 -->
  <symbol id="icon-safety" viewBox="0 0 48 48">
    <path d="M24 6 L38 12 L38 23 Q38 34.5 24 42 Q10 34.5 10 23 L10 12 Z"
          fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M24 31 C20.4 28.4 18.6 26 18.6 23.6 C18.6 21.4 20.2 20.2 21.8 20.2 C22.9 20.2 23.7 20.9 24 21.9 C24.3 20.9 25.1 20.2 26.2 20.2 C27.8 20.2 29.4 21.4 29.4 23.6 C29.4 26 27.6 28.4 24 31 Z"
          fill="currentColor" fill-opacity="0.45"/>
  </symbol>

  <!-- 充电 · 装有爱心的电池 -->
  <symbol id="icon-charge" viewBox="0 0 48 48">
    <rect x="8" y="16" width="28" height="18" rx="5" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="2.2"/>
    <rect x="37" y="21" width="4" height="8" rx="2" fill="currentColor" fill-opacity="0.35" stroke="currentColor" stroke-width="1.8"/>
    <path d="M22 29 C18.6 26.8 17 24.6 17 22.6 C17 20.8 18.4 19.8 19.7 19.8 C20.6 19.8 21.5 20.3 22 21.2 C22.5 20.3 23.4 19.8 24.3 19.8 C25.6 19.8 27 20.8 27 22.6 C27 24.6 25.4 26.8 22 29 Z"
          fill="currentColor" fill-opacity="0.4" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
  </symbol>

</svg>
