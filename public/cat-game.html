<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title id="cat-game-title">喵趣消消乐</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/neuroaesthetics.css">
    <script src="js/i18n.js"></script>
    <script>
        // i18n 辅助函数
        function _t(key, zhDefault) {
            if (!window.I18N) return zhDefault || key;
            if (I18N.currentLocale === "zh-CN") return zhDefault || key;
            return I18N.t(key) || zhDefault || key;
        }

        // 动态设置页面标题
        function updatePageTitle() {
            document.title = _t('cat_game.page_title', '喵趣消消乐');
        }
        document.addEventListener('DOMContentLoaded', updatePageTitle);
        document.addEventListener('localeChanged', updatePageTitle);
    </script>
    <script src="js/cache.js"></script>
    <link rel="icon" href="assets/images/cats/橘猫.png" type="image/png">
    <style>
        .back-btn {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            padding: 8px 18px;
            font-size: 14px;
            color: #333;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .back-btn:hover {
            background: #fff;
            border-color: #5cb8a8;
            color: #5cb8a8;
            transform: translateX(-3px);
        }
    </style>
</head>
<body>
    <!-- 猫咪消消乐不需要顶部导航栏 -->
    <div id="app-header" style="display:none;"></div>

    <!-- 游戏容器 -->
    <div id="game-container">
        <!-- 返回按钮 -->
        <button class="back-btn" data-i18n="cat_game.back_btn" onclick="location.href='index.html'" title="返回主页">← 返回</button>
        <!-- 顶部信息栏 -->
        <div id="header">
            <div class="score-panel">
                <div class="score-item">
                    <span class="label" data-i18n="cat_game.score_label">分数</span>
                    <span id="score" class="value">0</span>
                </div>
                <div class="score-item">
                    <span class="label" data-i18n="cat_game.cookie_label">🍪 饼干</span>
                    <span id="cookies" class="value cookie-value">0</span>
                </div>
                <div class="score-item">
                    <span class="label" data-i18n="cat_game.level_label">关卡</span>
                    <span id="level" class="value">1</span>
                </div>
                <!-- 音效/震动控制按钮 -->
                <div class="settings-btns">
                    <button id="btn-home" class="setting-btn" data-i18n-title="cat_game.btn_home_title">🏠</button>
                    <button id="btn-affinity" class="setting-btn" data-i18n-title="cat_game.btn_affinity_title">💖</button>
                    <button id="btn-mute" class="setting-btn" data-i18n-title="cat_game.btn_mute_title">🔊</button>
                    <button id="btn-vibrate" class="setting-btn" data-i18n-title="cat_game.btn_vibrate_title">📳</button>
                </div>
            </div>
            <!-- 猫咪小请求面板 -->
            <div class="request-panel" id="request-panel">
                <div class="request-header">
                    <span class="request-label" data-i18n="cat_game.request_label">🐱 猫咪的小请求</span>
                    <span class="request-status" id="request-status"></span>
                </div>
                <div class="request-content">
                    <div class="request-cat-icon">
                        <span class="target-cat"></span>
                    </div>
                    <div class="request-info">
                        <div class="request-desc" id="request-desc" data-i18n="cat_game.loading">加载中...</div>
                        <div class="request-progress-bar">
                            <div class="progress-fill" id="progress-fill"></div>
                        </div>
                        <div class="request-count" id="target-text">
                            <span id="request-current">0</span> / <span id="target-count">10</span>
                        </div>
                    </div>
                </div>
            </div>
            <!-- 向后兼容：旧目标面板（隐藏） -->
            <div class="target-panel" style="display: none;">
                <span class="target-label" data-i18n="cat_game.target_label_old">目标:</span>
                <span id="target-text-old">收集 <span class="target-cat"></span> x <span id="target-count-old">10</span></span>
            </div>
            <!-- Buff 状态显示 -->
            <div id="buff-container"></div>
            <!-- 模式切换按钮 -->
            <button id="btn-relax-mode" data-i18n="cat_game.relax_mode" title="切换到猫咪庭院">🌸 庭院</button>
        </div>

        <!-- 游戏棋盘 -->
        <div id="board-container">
            <div id="game-board"></div>
            <!-- 消除特效层 -->
            <div id="effects-layer"></div>
        </div>

        <!-- 道具栏 -->
        <div id="items-bar">
            <div class="item" data-item="bomb" data-i18n-title="cat_game.item_bomb">
                <div class="item-icon">🐟</div>
                <div class="item-count" id="bomb-count">3</div>
            </div>
            <div class="item" data-item="shuffle" data-i18n-title="cat_game.item_shuffle">
                <div class="item-icon">🎣</div>
                <div class="item-count" id="shuffle-count">2</div>
            </div>
            <div class="item" data-item="refresh" data-i18n-title="cat_game.item_refresh">
                <div class="item-icon">🐾</div>
                <div class="item-count" id="refresh-count">2</div>
            </div>
            <div class="item" data-item="hint" data-i18n-title="cat_game.item_hint">
                <div class="item-icon">💡</div>
                <div class="item-count" id="hint-count">5</div>
            </div>
        </div>

        <!-- 底部按钮 -->
        <div id="footer">
            <button id="btn-pause" class="btn" data-i18n="cat_game.pause">暂停</button>
            <button id="btn-restart" class="btn" data-i18n="cat_game.restart">重新开始</button>
        </div>
    </div>

    <!-- 暂停弹窗 -->
    <div id="pause-modal" class="modal hidden">
        <div class="modal-content">
            <h2 data-i18n="cat_game.pause_title">游戏暂停</h2>
            <div class="modal-buttons">
                <button id="btn-resume" class="btn btn-primary" data-i18n="cat_game.resume">继续游戏</button>
                <button id="btn-restart-modal" class="btn" data-i18n="cat_game.restart">重新开始</button>
            </div>
        </div>
    </div>

    <!-- 过关弹窗 -->
    <div id="win-modal" class="modal hidden">
        <div class="modal-content">
            <h2 data-i18n="cat_game.win_title">🎉 恭喜过关！</h2>
            <div class="star-rating">
                <span class="star" data-star="1">⭐</span>
                <span class="star" data-star="2">⭐</span>
                <span class="star" data-star="3">⭐</span>
            </div>
            <p><span data-i18n="cat_game.final_score">得分:</span> <span id="final-score">0</span></p>
            <div class="modal-buttons">
                <button id="btn-next-level" class="btn btn-primary" data-i18n="cat_game.next_level">下一关</button>
                <button id="btn-replay" class="btn" data-i18n="cat_game.replay">再玩一次</button>
            </div>
        </div>
    </div>

    <!-- 连击提示 -->
    <div id="combo-display" class="hidden">
        <span id="combo-text"></span>
    </div>

    <!-- 请求完成提示 -->
        <div id="request-complete-hint" class="hidden">
            <span data-i18n="cat_game.request_complete">🎉 请求完成！猫咪很开心！</span>
        </div>

    <script src="js/game.js"></script>

    <!-- 猫咪消消乐不需要顶部导航栏 -->
</body>
</html>
