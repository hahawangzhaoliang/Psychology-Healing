    <link rel="stylesheet" href="css/neuroaesthetics.css">
    <style>
        /* ===== 仅保留设计系统未覆盖的样式 ===== */

        /* 量表选项（设计系统无对应组件） */
        .scale-options { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.5rem; }
        .scale-option {
            display: flex; align-items: center; gap: 0.75rem;
            padding: 0.75rem 1rem;
            border: 1.5px solid var(--theme-border);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s;
            background: var(--theme-card);
        }
        .scale-option:hover { border-color: var(--color-primary-300); background: var(--color-primary-50); }
        .scale-option.selected {
            border-color: var(--color-primary-400);
            background: var(--color-primary-50);
            box-shadow: 0 0 0 3px rgba(92,184,168,0.15);
        }
        .option-radio {
            width: 20px; height: 20px; border-radius: 50%;
            border: 2px solid var(--color-gray-300);
            flex-shrink: 0; transition: all 0.2s;
        }
        .scale-option.selected .option-radio {
            border-color: var(--color-primary-400);
            background: radial-gradient(circle, var(--color-primary-400) 40%, transparent 42%);
        }
        .option-label { font-size: 0.92rem; color: var(--theme-text); line-height: 1.5; }

        /* 阶段切换 */
        .step { display: none; }
        .step.active { display: block; animation: fadeInUp 0.4s var(--ease-standard) both; }

        /* Hero 区域（设计系统无此组件） */
        .hero {
            padding: 6rem 1rem 3rem;
            text-align: center;
            background: linear-gradient(180deg, var(--color-primary-50), transparent);
        }
        .hero-inner { max-width: 640px; margin: 0 auto; }
        .hero-icon { font-size: 3rem; line-height: 1; }
        .hero-title {
            font-size: clamp(1.6rem, 4vw, 2.4rem);
            font-weight: 800;
            color: var(--theme-text);
            margin-bottom: 0.5rem;
            line-height: 1.25;
        }
        .hero-title .highlight { color: var(--color-primary-500); }
        .hero-subtitle {
            font-size: 1rem;
            color: var(--theme-text-light);
            line-height: 1.6;
        }

        /* 结果页排名条 */
        .rank-bar-track {
            width: 100%; height: 5px;
            background: var(--color-gray-100);
            border-radius: 50px; overflow: hidden;
        }
        .rank-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--color-primary-400), var(--color-primary-500));
            border-radius: 50px;
            transition: width 0.8s var(--ease-standard);
        }
    </style>

    <script src="js/i18n.js"></script>
    <script src="js/components/header.js"></script>
    <script src="js/assessment-via.js"></script>
    <script>
        /* ============================================================
           测评控制器：只负责 UI 交互，不重复实现测评逻辑
           所有数据和计分都通过 VIAInventory 公开 API 完成
           API: startAssessment(), generateReport(answers)
           API: calculateScores(answers), getInterpretation(id)
        ============================================================ */
        if (typeof renderHeader === 'function') {
            renderHeader({ currentPage: 'via', showLangSwitcher: true });
        }

        const ViaAssessment = (() => {
            'use strict';

            // 状态：只存 UI 状态，不存测评数据
            let state = {
                currentIndex: 0,
                answers: [],   // [score, score, ...] 按题目顺序
                total: 0,
                items: [],     // 当前测评题目列表
            };

            // 语言判断（与 i18n.js 保持一致）
            function _isEn() {
                if (window.I18N && I18N.currentLocale === 'en') return true;
                if (document.documentElement.lang === 'en') return true;
                if (localStorage.getItem('xinqing_locale') === 'en') return true;
                return false;
            }

            // 翻译辅助
            function _t(key, zhDefault) {
                if (!window.I18N) return zhDefault || key;
                if (I18N.currentLocale === 'zh-CN') return zhDefault || key;
                return I18N.t(key) || zhDefault || key;
            }

            // ===== 阶段切换 =====
            function _showStep(stepId) {
                ['step-intro', 'step-question', 'step-result'].forEach(id => {
                    document.getElementById(id).classList.toggle('active', id === stepId);
                });
            }

            // ===== 开始测评 =====
            function startQuiz() {
                const data = VIAInventory.startAssessment();
                state.items = data.items;
                state.total = data.totalItems;
                state.currentIndex = 0;
                state.answers = new Array(state.total).fill(null);
                document.getElementById('total-q').textContent = state.total;
                _showStep('step-question');
                _renderQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            // ===== 渲染当前题目 =====
            function _renderQuestion() {
                const item = state.items[state.currentIndex];
                const qText = _isEn() ? item.textEn : item.text;
                document.getElementById('question-text').textContent = qText;
                document.getElementById('current-q').textContent = state.currentIndex + 1;

                // 进度条（复用设计系统 .progress-bar-fill）
                const pct = Math.round(((state.currentIndex + 1) / state.total) * 100);
                document.getElementById('progress-fill').style.width = pct + '%';
                document.getElementById('progress-pct').textContent = pct + '%';

                // 5 点量表
                const labels = [
                    { value: 1, key: 'via.scale_1', zh: '非常不像我' },
                    { value: 2, key: 'via.scale_2', zh: '不太像我' },
                    { value: 3, key: 'via.scale_3', zh: '中等像我' },
                    { value: 4, key: 'via.scale_4', zh: '比较像我' },
                    { value: 5, key: 'via.scale_5', zh: '非常像我' },
                ];
                document.getElementById('scale-options').innerHTML = labels.map(l => {
                    const selected = state.answers[state.currentIndex] === l.value;
                    return `<div class="scale-option${selected ? ' selected' : ''}"
                                 onclick="ViaAssessment.selectOption(${l.value}, this)">
                                <div class="option-radio"></div>
                                <span class="option-label">${_t(l.key, l.zh)}</span>
                            </div>`;
                }).join('');

                // 更新按钮文字
                const isLast = state.currentIndex === state.total - 1;
                document.getElementById('btn-next').textContent =
                    _t(isLast ? 'via.btn_finish' : 'via.btn_next', isLast ? '查看结果' : '下一题');
            }

            // ===== 选择选项 =====
            function selectOption(value, el) {
                state.answers[state.currentIndex] = value;
                el.parentNode.querySelectorAll('.scale-option').forEach(o => o.classList.remove('selected'));
                el.classList.add('selected');
            }

            // ===== 下一题 =====
            function nextQuestion() {
                if (state.answers[state.currentIndex] === null) return; // 未作答
                if (state.currentIndex < state.total - 1) {
                    state.currentIndex++;
                    _renderQuestion();
                } else {
                    _showResults();
                }
            }

            // ===== 上一题 =====
            function prevQuestion() {
                if (state.currentIndex > 0) {
                    state.currentIndex--;
                    _renderQuestion();
                }
            }

            // ===== 显示结果 =====
            function _showResults() {
                const report = VIAInventory.generateReport(state.answers);
                _renderSignatureStrengths(report.signatureStrengths);
                _showStep('step-result');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            // ===== 渲染前 5 大优势卡片 =====
            function _renderSignatureStrengths(strengths) {
                const container = document.getElementById('signature-strengths');
                const rankColors = ['#F59E0B', '#94A3B8', '#92400E', '#5CB8A8', '#22D3EE'];
                container.innerHTML = strengths.map((s, i) => `
                    <div class="card" style="display: flex; gap: 0.85rem; align-items: flex-start; padding: 1rem 1.25rem;">
                        <div style="width: 34px; height: 34px; flex-shrink: 0; border-radius: 10px;
                                      background: ${rankColors[i]}; color: white;
                                      display: flex; align-items: center; justify-content: center;
                                      font-weight: 800; font-size: 0.9rem;">
                            ${i + 1}
                        </div>
                        <div style="flex: 1; min-width: 0;">
                            <div style="font-size: 0.98rem; font-weight: 700; color: var(--theme-text); margin-bottom: 0.2rem;">
                                ${s.name}
                            </div>
                            <div style="font-size: 0.78rem; color: var(--color-primary-500); font-weight: 500; margin-bottom: 0.35rem;">
                                ${s.virtueName}
                            </div>
                            <div class="rank-bar-track"><div class="rank-bar-fill" style="width: ${s.percentage.toFixed(0)}%;"></div></div>
                            <div style="font-size: 0.82rem; color: var(--theme-text-light); margin-top: 0.45rem; line-height: 1.6;">
                                ${s.interpretation ? s.interpretation.summary : ''}
                            </div>
                        </div>
                    </div>
                `).join('');
            }

            // ===== 切换完整排名显示 =====
            function toggleFullRanking() {
                const el = document.getElementById('full-ranking');
                if (el.style.display === 'none') {
                    el.style.display = 'block';
                    const result = VIAInventory.calculateScores(state.answers);
                    el.innerHTML = result.scores.map((s, i) => `
                        <div style="display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0.75rem; border-radius: var(--radius-sm); margin-bottom: 0.3rem; font-size: 0.85rem;">
                            <span style="color: var(--theme-text-light); width: 2rem;">${i + 1}</span>
                            <span style="flex: 1; color: var(--theme-text);">${s.cn || s.en || s.id}</span>
                            <span style="color: var(--theme-text-light); font-weight: 600;">${s.averageScore.toFixed(1)}</span>
                        </div>
                    `).join('');
                } else {
                    el.style.display = 'none';
                }
            }

            // ===== 重新测评 =====
            function restart() {
                state = { currentIndex: 0, answers: [], total: 0, items: [] };
                _showStep('step-intro');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            // ===== 公开 API =====
            return { startQuiz, nextQuestion, prevQuestion, selectOption, toggleFullRanking, restart };
        })();
    </script>
