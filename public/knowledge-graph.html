    <script>
    // ========= i18n 辅助函数 =========
    function _t(key, zhDefault) {
        if (!window.I18N) return zhDefault || key;
        if (I18N.currentLocale === "zh-CN") return zhDefault || key;
        return I18N.t(key) || zhDefault || key;
    }


    // ========== 全局状态 ==========
    let theories = [];
    let theoryNodes = [];
    let relationships = [];
    let graphSim = null;
    let rawNodes = [];   // 保留未归一化的原始节点，供语言切换时重新渲染
    let rawEdges = [];
    let currentFilter = 'all';
    let currentView = 'graph';
    let themeNodes = [];
    let activeThemeId = null;
    let svg, g, zoomTransform = { k: 1, x: 0, y: 0 };

    // ========== 颜色映射（适配心晴空间色系） ==========
    const colorMap = {
        positive:   '#E07A5F',
        cognitive:  '#3D8B8B',
        clinical:   '#5B8DB8',
        motivation: '#D4A373'
    };
    // 分类/难度名称改为函数式，确保语言切换后取值正确
    function getCategoryName(cat) {
        const map = {
            positive:   _t('knowledge_graph.cat_positive', '积极心理学'),
            cognitive:  _t('knowledge_graph.cat_cognitive', '认知心理学'),
            clinical:   _t('knowledge_graph.cat_clinical', '临床治疗'),
            motivation: _t('knowledge_graph.cat_motivation', '动机与改变')
        };
        return map[cat] || cat;
    }
    function getDiffName(diff) {
        const map = {
            beginner:     _t('knowledge_graph.diff_beginner', '入门'),
            intermediate: _t('knowledge_graph.diff_intermediate', '进阶'),
            advanced:     _t('knowledge_graph.diff_advanced', '深入')
        };
        return map[diff] || diff;
    }
    const diffColors = {
        beginner:     '#10B981',
        intermediate: '#F59E0B',
        advanced:     '#8B5CF6'
    };

    // ========== 数据加载 ==========
    function normalizeData(raw) {
        const isEn = window.I18N && I18N.currentLocale === 'en';
        const pick = (f) => (f == null ? '' : (typeof f === 'string' ? f : (isEn ? (f.en || f.zh || '') : (f.zh || f.en || ''))));
        const nodes = (raw.nodes || []).map(n => {
            const t = n.type || 'theory';
            return {
                ...n,
                type: t,
                label: pick(n.label),
                category: n.category || (t === 'book' ? 'book' : t === 'theme' ? 'theme' : 'concept'),
                difficulty: n.difficulty || 'beginner',
                summary: pick(n.summary),
                desc: pick(n.desc),
                author: n.author || '',
                year: n.year || '',
                practices: n.practices || [],
                coreTheories: n.coreTheories || [],
                healing: n.healing || [],
                audience: n.audience || [],
                contribution: n.contribution || [],
                quote: n.quote || '',
                date: n.date || '',
                // v3 新增字段
                author: n.author || '',
                publisher: n.publisher || '',
                oneLine: n.oneLine || '',
                pathReason: pick(n.pathReason),
                themeIds: n.themeIds || [],
                color: t === 'theme' ? '#D4956A' : t === 'book' ? '#6B9BD1' : (colorMap[n.category] || '#5A9A8A'),
            };
        });
        const edges = (raw.edges || []).map(e => ({
            relation: e.relation || 'related',
            note: e.note || '',
            source: typeof e.source === 'object' ? e.source.id : e.source,
            target: typeof e.target === 'object' ? e.target.id : e.target,
        }));
        return { nodes, edges };
    }

    // ========== 数据加载 ==========
    async function loadData() {
        const loadingEl = document.getElementById('loadingState');
        const errorEl = document.getElementById('errorState');

        try {
            // v3：含书籍字段（作者/疗愈维度/学科）与书间语义互文边，由 scripts/build_graph_v3.py 生成
            // v2 作为兜底，保证 v3 缺失时页面仍可用
            let data = null;
            for (const src of ['/data/graph-v3.json?v=1', '/data/graph-v2.json?v=3']) {
                try {
                    data = await Cache.cachedFetch(src);
                    if (data && data.nodes && data.nodes.length) {
                        console.log('知识图谱数据源:', src);
                        break;
                    }
                    data = null;
                } catch (loadErr) {
                    console.log(src, 'load failed', loadErr);
                }
            }
            if (!data || !data.nodes.length) {
                try {
                    const json = await Cache.cachedFetch('/api/knowledge/graph');
                    data = { nodes: json.nodes || [], edges: json.edges || [] };
                } catch (apiErr) {
                    console.log('API load failed', apiErr);
                }
            }
            if (!data || !data.nodes.length) {
                throw new Error('无可用数据');
            }

            rawNodes = data.nodes || [];
            rawEdges = data.edges || [];
            const normalized = normalizeData(data);
            theories = normalized.nodes;
            relationships = normalized.edges;
            theoryNodes = theories.filter(n => n.type === 'theory');
            themeNodes = theories.filter(n => n.type === 'theme');
            bindEchoToggle();   // 数据就绪后再绑定图层开关

            // 动态生成主题筛选 chips
            const chipsWrap = document.getElementById('themeChips');
            if (chipsWrap) {
                themeNodes.forEach(t => {
                    const b = document.createElement('button');
                    b.className = 'filter-chip';
                    b.dataset.filter = t.id;
                    b.innerHTML = `<span class="dot" style="background:#D4956A;"></span>${t.label}`;
                    b.addEventListener('click', () => { currentFilter = b.dataset.filter; activeThemeId = null; applyFilter(); });
                    chipsWrap.appendChild(b);
                });
            }

            loadingEl.style.display = 'none';
            document.getElementById('graphView').style.display = 'block';

            // 等待浏览器重排后再初始化（否则 wrapper 尺寸为 0）
            requestAnimationFrame(() => {
                // 初始化视图
                initGraph();
                renderPath();
            });
        } catch (err) {
            console.error('数据加载失败:', err);
            loadingEl.style.display = 'none';
            errorEl.style.display = 'block';
        }
    }

    // ========== D3 图谱（三层节点） ==========
    function nodeRadius(d) {
        return d.type === 'theme' ? 30 : d.type === 'book' ? 17 : 11;
    }
    function edgeStyle(e) {
        if (e.relation === 'contains') return { stroke: '#D4956A', dash: '5,4', op: 0.28, dist: 90 };
        if (e.relation === 'covers') return { stroke: '#8fa8c8', dash: '3,4', op: 0.22, dist: 100 };
        // 书籍间语义互文：更细更淡，默认隐藏（由 echoLayerOn 控制）
        if (e.relation === 'echoes') return { stroke: '#7FBFA8', dash: '2,5', op: 0.34, dist: 130 };
        return { stroke: '#bbb', dash: null, op: 0.45, dist: 110 };
    }

    // ========== 书籍互文图层开关 ==========
    // 默认关闭：开启后显示书↔书 的语义互文边。
    // 边会影响力导向布局，因此切换时重建模拟，而非仅改样式。
    let echoLayerOn = false;
    function currentEdges() {
        return echoLayerOn ? relationships : relationships.filter(e => e.relation !== 'echoes');
    }
    function applyEchoLayer() {
        const btn = document.getElementById('echoLayerToggle');
        if (btn) btn.classList.toggle('active', echoLayerOn);
        if (!g || currentView !== 'graph') return;
        // 重建模拟：边集合变了，forceLink 的输入也必须变
        initGraph();
        // 等待新一层渲染后再套用筛选，避免作用在已被清空的旧元素上
        requestAnimationFrame(() => {
            requestAnimationFrame(() => applyCurrentFilter());
        });
    }
    function initGraph() {
        const wrapper = document.querySelector('.graph-svg-wrapper');
        const w = wrapper.clientWidth;
        const h = wrapper.clientHeight;

        // 停止上一轮模拟：否则旧 sim 会继续往已移除的 DOM 写坐标，
        // 并与新 sim 争抢 theories 节点的坐标。
        if (graphSim) { graphSim.stop(); graphSim = null; }

        // 重建前清空旧图层，避免重复叠加
        svg = d3.select('#graphSvg');
        svg.selectAll('*').remove();
        svg.attr('width', w).attr('height', h);

        const zoom = d3.zoom()
            .scaleExtent([0.3, 3])
            .on('zoom', e => {
                g.attr('transform', e.transform);
                zoomTransform = e.transform;
            });
        svg.call(zoom);

        g = svg.append('g');

        const edges = currentEdges();

        graphSim = d3.forceSimulation(theories)
            .force('link', d3.forceLink(edges).id(d => d.id).distance(e => edgeStyle(e).dist))
            .force('charge', d3.forceManyBody().strength(-520))
            .force('center', d3.forceCenter(w / 2, h / 2))
            .force('collide', d3.forceCollide().radius(d => nodeRadius(d) + 14));

        const link = g.append('g')
            .selectAll('line')
            .data(edges)
            .join('line')
            .attr('stroke', e => edgeStyle(e).stroke)
            .attr('stroke-dasharray', e => edgeStyle(e).dash || null)
            .attr('stroke-opacity', e => edgeStyle(e).op)
            .attr('stroke-width', e => e.relation === 'contains' ? 1.6 : 1.2);

        const linkLabel = g.append('g')
            .selectAll('text')
            .data(edges)
            .join('text')
            .attr('class', 'link-label')
            .text(d => d.type)
            .attr('dy', -4);

        const node = g.append('g')
            .selectAll('g')
            .data(theories)
            .join('g')
            .attr('class', 'graph-node')
            .call(d3.drag()
                .on('start', (e, d) => {
                    if (!e.active) graphSim.alphaTarget(0.3).restart();
                    d.fx = d.x;
                    d.fy = d.y;
                })
                .on('drag', (e, d) => {
                    d.fx = e.x;
                    d.fy = e.y;
                })
                .on('end', (e, d) => {
                    if (!e.active) graphSim.alphaTarget(0);
                    d.fx = null;
                    d.fy = null;
                }));

        // 主题层：大圆环 + 核心
        node.filter(d => d.type === 'theme').append('circle')
            .attr('r', 30)
            .attr('fill', 'rgba(212,149,106,0.13)')
            .attr('stroke', '#D4956A')
            .attr('stroke-width', 2.2)
            .attr('cursor', 'pointer')
            .attr('class', 'theme-halo')
            .on('mouseover', showTooltip)
            .on('mouseout', hideTooltip)
            .on('click', (e, d) => { e.stopPropagation(); toggleTheme(d); });
        node.filter(d => d.type === 'theme').append('circle')
            .attr('r', 8)
            .attr('fill', '#D4956A')
            .attr('stroke', '#fff')
            .attr('stroke-width', 2)
            .attr('cursor', 'pointer')
            .on('mouseover', showTooltip)
            .on('mouseout', hideTooltip)
            .on('click', (e, d) => { e.stopPropagation(); toggleTheme(d); });
        node.filter(d => d.type === 'theme').append('text')
            .attr('class', 'node-label')
            .attr('dy', -38)
            .attr('font-size', '13px')
            .attr('font-weight', '700')
            .attr('fill', '#A06B45')
            .text(d => d.label);

        // 书籍层：圆角方块（默认弱化，hover 强化）
        node.filter(d => d.type === 'book').append('rect')
            .attr('width', 62)
            .attr('height', 34)
            .attr('x', -31)
            .attr('y', -17)
            .attr('rx', 9)
            .attr('fill', '#6B9BD1')
            .attr('fill-opacity', 0.82)
            .attr('stroke', '#fff')
            .attr('stroke-width', 2)
            .attr('cursor', 'pointer')
            .style('opacity', 0.55)
            .on('mouseover', function(e, d) { d3.select(this).style('opacity', 1); showTooltip(e, d); })
            .on('mouseout', function(e, d) { d3.select(this).style('opacity', 0.55); hideTooltip(); })
            .on('click', (e, d) => { e.stopPropagation(); openDetail(d); });
        node.filter(d => d.type === 'book').append('text')
            .attr('class', 'node-label')
            .attr('dy', 3.5)
            .attr('font-size', '10.5px')
            .attr('font-weight', '600')
            .attr('fill', '#ffffff')
            .text(d => (d.label.length > 7 ? d.label.slice(0, 7) + '…' : d.label));

        // 理论层：小圆（分类色）
        node.filter(d => d.type === 'theory').append('circle')
            .attr('r', 11)
            .attr('fill', d => colorMap[d.category] || '#5A9A8A')
            .attr('stroke', '#fff')
            .attr('stroke-width', 2)
            .attr('cursor', 'pointer')
            .on('mouseover', showTooltip)
            .on('mouseout', hideTooltip)
            .on('click', (e, d) => { e.stopPropagation(); openDetail(d); });
        node.filter(d => d.type === 'theory').append('text')
            .attr('class', 'node-label')
            .attr('dy', 4)
            .attr('font-size', '10px')
            .attr('font-weight', '600')
            .attr('fill', '#4a4a4a')
            .text(d => (d.label.length > 8 ? d.label.slice(0, 8) + '…' : d.label));

        graphSim.on('tick', () => {
            link
                .attr('x1', d => d.source.x)
                .attr('y1', d => d.source.y)
                .attr('x2', d => d.target.x)
                .attr('y2', d => d.target.y);
            linkLabel
                .attr('x', d => (d.source.x + d.target.x) / 2)
                .attr('y', d => (d.source.y + d.target.y) / 2);
            node.attr('transform', d => `translate(${d.x},${d.y})`);
        });

        // 主题切换：高亮该主题子图
        function toggleTheme(d) {
            const isActive = activeThemeId === d.id;
            activeThemeId = isActive ? null : d.id;
            applyFilter();
        }

        window.addEventListener('resize', () => {
            const wrapper = document.querySelector('.graph-svg-wrapper');
            const nw = wrapper.clientWidth;
            const nh = wrapper.clientHeight;
            svg.attr('width', nw).attr('height', nh);
            graphSim.force('center', d3.forceCenter(nw / 2, nh / 2));
            graphSim.alpha(0.3).restart();
        });
    }

    // ========== 缩放控制 ==========
    function zoomIn() {
        const wrapper = document.querySelector('.graph-svg-wrapper');
        const w = wrapper.clientWidth, h = wrapper.clientHeight;
        const t = d3.zoomIdentity.translate(w/2, h/2).scale(zoomTransform.k * 1.3).translate(-w/2, -h/2);
        d3.select('#graphSvg').transition().duration(300).call(d3.zoom().transform, t);
    }
    function zoomOut() {
        const wrapper = document.querySelector('.graph-svg-wrapper');
        const w = wrapper.clientWidth, h = wrapper.clientHeight;
        const t = d3.zoomIdentity.translate(w/2, h/2).scale(zoomTransform.k / 1.3).translate(-w/2, -h/2);
        d3.select('#graphSvg').transition().duration(300).call(d3.zoom().transform, t);
    }
    function resetZoom() {
        d3.select('#graphSvg').transition().duration(300).call(d3.zoom().transform, d3.zoomIdentity);
    }

    // ========== Tooltip ==========
    function showTooltip(e, d) {
        const t = document.getElementById('tooltip');
        if (d.type === 'theme') {
            const cnt = relationships.filter(r => r.source === d.id || r.target === d.id).length;
            t.innerHTML = `<strong>${d.label}</strong><br/><span style="font-size:.8rem;opacity:.75">${_t('knowledge_graph.tt_theme', '主题 · {n} 本书').replace('{n}', cnt)}</span><br/><span style="font-size:.75rem;opacity:.6">${_t('knowledge_graph.tt_click_theme', '点击查看主题书籍')}</span>`;
        } else if (d.type === 'book') {
            t.innerHTML = `<strong>${d.label}</strong><span style="opacity:.75"> · ${_t('knowledge_graph.tt_book', '疗愈书籍 · 读书笔记')}</span><br/><span style="font-size:.8rem;opacity:.7">${(d.coreTheories || []).slice(0, 2).join(' · ')}</span>`;
        } else {
            t.innerHTML = `<strong>${d.label}</strong><span style="opacity:.8">${getCategoryName(d.category)} · ${getDiffName(d.difficulty)}</span><br/><span style="font-size:.8rem;opacity:.7">${d.author} (${d.year})</span>`;
        }
        t.style.display = 'block';
        t.style.left = (e.clientX + 12) + 'px';
        t.style.top = (e.clientY - 12) + 'px';
    }
    function hideTooltip() {
        document.getElementById('tooltip').style.display = 'none';
    }

        }
        if (d.practice) {
            html += `<div class="detail-section"><div class="detail-section-title"><svg class="icon icon--md"><use href="#icon-circle-check"></use></svg> ${_t('knowledge_graph.section_practice', '实践练习')}</div><p>${d.practice}</p></div>`;
        }

    function openBookDetail(b) {
        const overlay = document.getElementById('detailOverlay');
        const sheet = document.getElementById('detailSheet');
        document.getElementById('detailCategory').textContent = _t('knowledge_graph.tt_book', '疗愈书籍 · 读书笔记');
        document.getElementById('detailTitle').textContent = b.label;
        const metaBits = [];
        if (b.author) metaBits.push(b.author);
        if (b.publisher) metaBits.push(b.publisher);
        if (b.date) metaBits.push(b.date);
        document.getElementById('detailMeta').textContent = metaBits.join(' · ');
        document.getElementById('detailHeader').style.background = 'linear-gradient(135deg,#6B9BD1 0%,' + adjustColor('#6B9BD1', -30) + ')';
        let html = '';
        if (b.oneLine) html += `<div class="detail-section"><div class="detail-section-title"><svg class="icon icon--md"><use href="#icon-lightbulb"></use></svg> ${_t('knowledge_graph.section_book_oneline', '一句话主题')}</div><p style="font-style:italic;">${b.oneLine}</p></div>`;
        if (b.quote) html += `<div class="detail-section"><div class="detail-section-title"><svg class="icon icon--md"><use href="#icon-heart"></use></svg> ${_t('knowledge_graph.section_book_quote', '书中一句话')}</div><p style="font-style:italic;">${b.quote}</p></div>`;
        if (b.core) html += `<div class="detail-section"><div class="detail-section-title"><svg class="icon icon--md"><use href="#icon-lightbulb"></use></svg> ${_t('knowledge_graph.section_book_core', '核心内容')}</div><p>${b.core}</p></div>`;
        if (b.coreTheories && b.coreTheories.length) html += `<div class="detail-section"><div class="detail-section-title"><svg class="icon icon--md"><use href="#icon-star"></use></svg> ${_t('knowledge_graph.section_book_meta', '核心理论')}</div><div class="detail-tags">${b.coreTheories.map(c => `<span class="card-tag">${c}</span>`).join('')}</div></div>`;
        if (b.lifeExamples) html += `<div class="detail-section"><div class="detail-section-title"><svg class="icon icon--md"><use href="#icon-flower"></use></svg> ${_t('knowledge_graph.section_book_life', '生活例子')}</div><p>${b.lifeExamples}</p></div>`;
        if (b.practices) html += `<div class="detail-section"><div class="detail-section-title"><svg class="icon icon--md"><use href="#icon-play"></use></svg> ${_t('knowledge_graph.section_book_practice', '实践练习')}</div><p>${b.practices}</p></div>`;
        if (b.discipline && b.discipline.length) html += `<div class="detail-section"><div class="detail-section-title"><svg class="icon icon--md"><use href="#icon-knowledge"></use></svg> ${_t('knowledge_graph.section_book_disc', '学科领域')}</div><p>${b.discipline.join(' · ')}</p></div>`;
        if (b.healing && b.healing.length) html += `<div class="detail-section"><div class="detail-section-title"><svg class="icon icon--md"><use href="#icon-leaf"></use></svg> ${_t('knowledge_graph.section_book_healing', '疗愈维度')}</div><p>${b.healing.join(' · ')}</p></div>`;
        if (b.audience && b.audience.length) html += `<div class="detail-section"><div class="detail-section-title"><svg class="icon icon--md"><use href="#icon-user"></use></svg> ${_t('knowledge_graph.section_book_audience', '适读人群')}</div><p>${b.audience.join(' · ')}</p></div>`;
        // 语义互文书籍（书↔书）
        const echoRel = relationships.filter(r => r.relation === 'echoes'
            && (r.source === b.id || r.target === b.id));
        if (echoRel.length) {
            const seen = new Set();
            const items = [];
            for (const r of echoRel) {
                const otherId = r.source === b.id ? r.target : r.source;
                if (seen.has(otherId)) continue;
                seen.add(otherId);
                const other = theories.find(t => t.id === otherId);
                if (other) items.push({ other, note: r.note || '' });
            }
            if (items.length) {
                html += `<div class="detail-section"><div class="detail-section-title"><svg class="icon icon--md"><use href="#icon-flow"></use></svg> ${_t('knowledge_graph.section_book_echo', '脉络衔接 · {n} 本').replace('{n}', items.length)}</div><div style="display:flex;flex-direction:column;gap:8px;">`;
                items.forEach(it => {
                    html += `<div style="padding:9px 12px;background:#f2f8f5;border-radius:12px;cursor:pointer;" onclick="openDetailById('${it.other.id}')">`
                        + `<div style="font-weight:600;font-size:13px;color:#2c3e50;">${it.other.label}</div>`
                        + (it.note ? `<div style="font-size:11px;color:#6b8a80;margin-top:3px;line-height:1.5;">${it.note}</div>` : '')
                        + `</div>`;
                });
                html += `</div></div>`;
            }
        }
        // 关联理论
        const relTheories = relationships.filter(r => (r.source === b.id || r.target === b.id) && (r.relation === 'covers'))
            .map(r => theoryNodes.find(t => t.id === (r.source === b.id ? r.target : r.source)))
            .filter(Boolean);
        if (relTheories.length) {
            html += `<div class="detail-section"><div class="detail-section-title"><svg class="icon icon--md"><use href="#icon-flow"></use></svg> ${_t('knowledge_graph.section_book_related', '关联理论')}</div><div class="detail-tags">${relTheories.map(t => `<span class="card-tag" style="cursor:pointer;" onclick="openDetailById('${t.id}')">${t.label}</span>`).join('')}</div></div>`;
        }
        document.getElementById('detailBody').innerHTML = html;
        overlay.classList.add('active');
        sheet.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function adjustColor(hex, amt) {
        let r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
        r = Math.max(0, Math.min(255, r + amt));
        g = Math.max(0, Math.min(255, g + amt));
        b = Math.max(0, Math.min(255, b + amt));
        return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
    }

    // ========== 卡片渲染 ==========
    
    // ========== 路径渲染 ==========
    function renderPath() {
        const container = document.getElementById('pathStages');
        const overview = document.getElementById('pathOverview');
        container.innerHTML = '';
        if (overview) overview.innerHTML = '';

        const stages = [
            { key: 'beginner', step: 1, icon: '<svg class="icon icon--md"><use href="#icon-leaf"></use></svg>',
              title: _t('knowledge_graph.stage1_title', '第一阶段：入门基础'),
              desc: _t('knowledge_graph.stage1_desc', '建立核心概念，理解心理学基础框架'),
              goal: _t('knowledge_graph.stage1_goal', '目标：能说清"念头如何影响情绪"，不再被情绪自动反应牵着走') },
            { key: 'intermediate', step: 2, icon: '<svg class="icon icon--md"><use href="#icon-knowledge"></use></svg>',
              title: _t('knowledge_graph.stage2_title', '第二阶段：进阶理解'),
              desc: _t('knowledge_graph.stage2_desc', '深入核心理论，开始觉察自身模式'),
              goal: _t('knowledge_graph.stage2_goal', '目标：能识别自己的思维与关系模式，并掌握对应的干预方法') },
            { key: 'advanced', step: 3, icon: '<svg class="icon icon--md"><use href="#icon-tree"></use></svg>',
              title: _t('knowledge_graph.stage3_title', '第三阶段：深入实践'),
              desc: _t('knowledge_graph.stage3_desc', '掌握复杂理论，整合应用于生活'),
              goal: _t('knowledge_graph.stage3_goal', '目标：能把多种理论整合成自己的长期实践方案') },
        ];

        const books = theories.filter(n => n.type === 'book');
        const themeFilter = currentFilter.startsWith('theme_') ? currentFilter : null;

        // ---- 顶部总览：三阶段进度条 ----
        if (overview) {
            const rows = stages.map(st => {
                const nt = theoryNodes.filter(t => t.difficulty === st.key).length;
                const nb = books.filter(b => b.difficulty === st.key).length;
                return { st, nt, nb, total: nt + nb };
            });
            const grand = rows.reduce((a, r) => a + r.total, 0) || 1;
            overview.innerHTML = '<div class="path-overview-row">'
                + rows.map(r => {
                    const pct = Math.round(r.total / grand * 100);
                    return `<div class="path-overview-step">
                        <div class="path-overview-num">${r.st.step}</div>
                        <div class="path-overview-meta">
                            <div class="path-overview-label">${_t('knowledge_graph.path_stat', '{t} 理论 · {b} 读物').replace('{t}', r.nt).replace('{b}', r.nb)}</div>
                            <div class="path-overview-bar"><span style="width:${pct}%"></span></div>
                        </div>
                    </div>`;
                }).join('')
                + '</div>';
        }

        stages.forEach(stage => {
            const items = theoryNodes
                .filter(t => t.difficulty === stage.key)
                .sort((a, b) => (a.order || 0) - (b.order || 0));

            // 理论按学科筛选（主题筛选对理论不适用）
            const catFilter = (!themeFilter && currentFilter !== 'all') ? currentFilter : null;
            const shownTheory = catFilter ? items.filter(t => t.category === catFilter) : items;

            // 书籍：主题筛选时只显示属于该主题的书
            let shownBooks = books.filter(b => b.difficulty === stage.key);
            if (themeFilter) {
                shownBooks = shownBooks.filter(b => (b.themeIds || []).indexOf(themeFilter) !== -1);
            }
            shownBooks.sort((a, b) => {
                const ar = a.pathReason ? 0 : 1, br = b.pathReason ? 0 : 1;
                if (ar !== br) return ar - br;           // 有推荐理由的排前面
                return String(a.label).localeCompare(String(b.label), 'zh');
            });

            if (!shownTheory.length && !shownBooks.length) return;

            const stageEl = document.createElement('div');
            stageEl.className = 'path-stage';

            // --- 核心理论区 ---
            let theoryHtml = '';
            if (shownTheory.length) {
                theoryHtml = '<div class="path-block">'
                    + '<div class="path-block-title">' + _t('knowledge_graph.path_theory_title', '核心理论') + '</div>'
                    + '<div class="path-cards">'
                    + shownTheory.map(t =>
                        `<div class="path-card" onclick="openDetailById('${t.id}')">`
                        + `<div class="path-card-index" style="background:${colorMap[t.category] || '#5A9A8A'};">${t.order || ''}</div>`
                        + `<div class="path-card-content">`
                        + `<div class="path-card-title">${t.label}</div>`
                        + `<div class="path-card-desc">${t.summary || ''}</div>`
                        + `</div></div>`
                    ).join('')
                    + '</div></div>';
            }

            // --- 推荐读物区 ---
            let bookHtml = '';
            if (shownBooks.length) {
                bookHtml = '<div class="path-block">'
                    + '<div class="path-block-title">'
                    + _t('knowledge_graph.path_book_title', '推荐读物')
                    + '<span class="path-block-count">' + shownBooks.length + '</span>'
                    + '</div>'
                    + '<div class="path-book-list">'
                    + shownBooks.map(b =>
                        `<div class="path-book" onclick="openDetailById('${b.id}')">`
                        + `<div class="path-book-main">`
                        + `<div class="path-book-title">${b.label}</div>`
                        + (b.author ? `<div class="path-book-author">${b.author}</div>` : '')
                        + (b.pathReason ? `<div class="path-book-why">${b.pathReason}</div>` : '')
                        + `</div>`
                        + '<svg class="icon icon--md path-book-arrow"><use href="#icon-flow"></use></svg>'
                        + `</div>`
                    ).join('')
                    + '</div></div>';
            }

            stageEl.innerHTML =
                `<div class="path-stage-header">`
                + `<div class="path-stage-icon">${stage.icon}</div>`
                + `<div class="path-stage-headtext">`
                + `<div class="path-stage-title">${stage.title}</div>`
                + `<div class="path-stage-desc">${stage.desc}</div>`
                + `<div class="path-stage-goal">${stage.goal}</div>`
                + `</div>`
                + `<div class="path-stage-counts">`
                + `<span class="path-count-chip">${shownTheory.length} ${_t('knowledge_graph.path_unit_theory', '理论')}</span>`
                + `<span class="path-count-chip">${shownBooks.length} ${_t('knowledge_graph.path_unit_book', '读物')}</span>`
                + `</div>`
                + `</div>`
                + theoryHtml + bookHtml;
            container.appendChild(stageEl);
        });

        // 全部为空时的兜底提示
        if (!container.children.length) {
            container.innerHTML = '<div class="empty-state"><p>'
                + _t('knowledge_graph.path_empty', '当前筛选条件下没有匹配的学习内容')
                + '</p></div>';
        }
    }

    function openDetailById(id) {
        const node = theories.find(t => t.id === id);
        if (node) openDetail(node);
    }

    function applyCurrentFilter() { applyFilter(); }

    // ========== 视图切换 ==========
    function switchView(view) {
        currentView = view;
        document.querySelectorAll('.view-tab').forEach(b => b.classList.toggle('active', b.dataset.view === view));
        document.getElementById('graphView').style.display = view === 'graph' ? 'block' : 'none';
                document.getElementById('pathView').style.display = view === 'path' ? 'block' : 'none';
        if (view === 'path') renderPath();
    }

    document.querySelectorAll('.view-tab').forEach(btn => {
        btn.addEventListener('click', () => switchView(btn.dataset.view));
    });

    // ========== 书籍互文图层开关 ==========
    // 注意：必须在 loadData() 之后绑定，否则 relationships 尚为空会误判"无边"而隐藏按钮。
    function bindEchoToggle() {
        const btn = document.getElementById('echoLayerToggle');
        if (!btn || btn.dataset.bound) return;
        btn.dataset.bound = '1';
        if (!relationships.some(e => e.relation === 'echoes')) {
            btn.style.display = 'none';
            return;
        }
        btn.addEventListener('click', () => {
            echoLayerOn = !echoLayerOn;
            applyEchoLayer();
        });
    }

    // ========== 筛选（全部 / 主题） ==========
    function applyFilter() {
        document.querySelectorAll('.filter-chip').forEach(b => {
            b.classList.toggle('active', b.dataset.filter === currentFilter);
        });
                if (currentView === 'path') renderPath();
        if (currentView === 'graph' && g) {
            const nodes = g.selectAll('g.graph-node');
            const links = g.selectAll('line');
            const labels = g.selectAll('.link-label');
            const active = activeThemeId || (currentFilter !== 'all' && currentFilter.startsWith('theme_') ? currentFilter : null);
            const themeBookIds = new Set();
            if (active) {
                theories.forEach(n => {
                    if (n.type === 'book' && (n.themeIds || []).indexOf(active) !== -1) themeBookIds.add(n.id);
                });
            }
            nodes.style('opacity', d => {
                if (!active) return d.type === 'book' ? 0.55 : 1;
                if (d.type === 'theme') return d.id === active ? 1 : 0.12;
                if (d.type === 'book') return themeBookIds.has(d.id) ? 1 : 0.12;
                // theory：与展开主题的书有关联
                return themeBookIds.size ? (relationships.some(r => (r.source === d.id && themeBookIds.has(r.target)) || (r.target === d.id && themeBookIds.has(r.source))) ? 1 : 0.12) : 0.12;
            });
            links.style('opacity', e => {
                if (!active) return edgeStyle(e).op;
                const sc = e.source.id || e.source, tc = e.target.id || e.target;
                const sTheme = sc === active, tTheme = tc === active;
                const sBook = themeBookIds.has(sc), tBook = themeBookIds.has(tc);
                const sTheory = theories.find(t => t.id === sc)?.type === 'theory';
                const tTheory = theories.find(t => t.id === tc)?.type === 'theory';
                if (sTheme && tBook || tTheme && sBook) return 0.5;
                if (sBook && tTheory || tBook && sTheory) return 0.5;
                if (sTheory && tTheory && (sTheme || tTheme)) return 0.2;
                return 0.06;
            });
            labels.style('opacity', d => {
                if (!active) return 1;
                const sc = d.source.id || d.source, tc = d.target.id || d.target;
                return (themeBookIds.has(sc) || themeBookIds.has(tc) || sc === active || tc === active) ? 1 : 0.05;
            });
        }
    }
    document.querySelectorAll('.filter-chip').forEach(btn => {
        btn.addEventListener('click', function() {
            currentFilter = this.dataset.filter;
            activeThemeId = null;
            applyFilter();
        });
    });

    // ========== 移动端菜单 ==========
    function toggleMobileMenu() {
        const menu = document.getElementById('mobileMenu');
        menu.classList.toggle('open');
    }

    // ========== ESC 关闭详情 ==========
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeDetail();
    });

    // ========== 初始化 ==========
    document.addEventListener('DOMContentLoaded', () => {
        loadData();
        document.getElementById('detailSheet').addEventListener('click', e => e.stopPropagation());
    });

    // 语言切换：阶段标题/目标/理由均由 _t() 与 {zh,en} 注入，
    // 不会被 data-i18n 自动重扫，必须重新归一化并重渲染。
    document.addEventListener('localeChanged', () => {
        // 用原始 rawNodes 重算，避免对已拍平的 label 二次归一化导致语种不可逆
        if (rawNodes.length) {
            const again = normalizeData({ nodes: rawNodes, edges: rawEdges });
            theories = again.nodes;
            relationships = again.edges;
            theoryNodes = theories.filter(n => n.type === 'theory');
            themeNodes = theories.filter(n => n.type === 'theme');
        }
        if (currentView === 'path') renderPath();
    });
    </script>
