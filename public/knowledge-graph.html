<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>心理知识图谱 — 心晴空间</title>

    <meta name="description" content="探索积极心理学与认知心理学，可视化知识关联与个性化学习路径">
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 神经美学设计系统 -->
    <link rel="stylesheet" href="css/neuroaesthetics.css">
    <link rel="stylesheet" href="css/icons-custom.css">
    <script src="js/cache.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/knowledge-graph.css">
    <style>
        /* 已提取到 css/knowledge-graph.css */
    </style>
</head>
<body>
<!-- 内联 SVG 图标定义 -->
<!--
  心晴空间 — 疗愈风格自定义 SVG 图标集
  设计理念：柔和、手绘感、有机形态、温暖疗愈
  使用方式：<svg class="icon icon--lg"><use href="#icon-home"></use></svg>
-->
<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden">

  <!-- ========== 首页 / 心晴空间 Logo ========== -->
  <symbol id="icon-home" viewBox="0 0 48 48">
    <!-- 小房子 + 心形窗户 -->
    <path d="M24 6 L6 22 L10 22 L10 40 L38 40 L38 22 L42 22 Z"
          fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- 门 -->
    <path d="M19 40 L19 30 Q24 27 29 30 L29 40"
          fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    <!-- 屋顶小装饰（叶子） -->
    <path d="M24 6 Q20 2 16 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  </symbol>

  <!-- ========== 情绪觉察 ========== -->
  <symbol id="icon-emotion" viewBox="0 0 48 48">
    <!-- 脸 -->
    <circle cx="24" cy="24" r="18" fill="none" stroke="currentColor" stroke-width="2.2"/>
    <!-- 眼睛：弯弯的笑眼 -->
    <path d="M16 20 Q18 16 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <path d="M28 20 Q30 16 32 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <!-- 嘴巴：微笑弧线 -->
    <path d="M17 29 Q24 36 31 29" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    <!-- 脸颊红晕（用两个小弧表示） -->
    <path d="M13 25 Q12 28 14 27" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    <path d="M34 25 Q35 28 33 27" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  </symbol>

  <!-- ========== 心流体验 ========== -->
  <symbol id="icon-flow" viewBox="0 0 48 48">
    <!-- 水波纹扩散，表示心流状态 -->
    <circle cx="24" cy="24" r="5" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="24" cy="24" r="12" fill="none" stroke="currentColor" stroke-width="1.8" opacity="0.7"/>
    <circle cx="24" cy="24" r="18" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
    <!-- 中心小点 -->
    <circle cx="24" cy="24" r="2" fill="currentColor" opacity="0.8"/>
  </symbol>

  <!-- ========== 知识图谱 ========== -->
  <symbol id="icon-knowledge" viewBox="0 0 48 48">
    <!-- 节点连接图，表示知识网络 -->
    <!-- 中心节点 -->
    <circle cx="24" cy="18" r="5" fill="none" stroke="currentColor" stroke-width="2.2"/>
    <!-- 左下节点 -->
    <circle cx="14" cy="34" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
    <!-- 右下节点 -->
    <circle cx="34" cy="34" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
    <!-- 连接线（柔和曲线） -->
    <path d="M22 22 Q20 28 16 31" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>
    <path d="M26 22 Q28 28 32 31" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>
    <path d="M20 18 Q24 15 28 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>
    <!-- 小装饰：中心节点内的小点 -->
    <circle cx="24" cy="18" r="1.5" fill="currentColor" opacity="0.5"/>
  </symbol>

  <!-- ========== 社区 ========== -->
  <symbol id="icon-community" viewBox="0 0 48 48">
    <!-- 两个人物，手拉手 -->
    <!-- 左边人物 -->
    <circle cx="17" cy="18" r="5" fill="none" stroke="currentColor" stroke-width="2"/>
    <path d="M10 46 Q10 30 17 28 Q24 30 24 46" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <!-- 右边人物 -->
    <circle cx="31" cy="18" r="5" fill="none" stroke="currentColor" stroke-width="2"/>
    <path d="M24 46 Q24 30 31 28 Q38 30 38 46" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <!-- 手拉手（弧线） -->
    <path d="M22 22 Q24 26 26 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <!-- ========== 猫咪（消消乐） ========== -->
  <symbol id="icon-cat" viewBox="0 0 48 48">
    <!-- 猫头 -->
    <path d="M14 20 Q10 8 20 12 Q24 6 28 12 Q38 8 34 20"
          fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- 猫脸 -->
    <circle cx="24" cy="26" r="11" fill="none" stroke="currentColor" stroke-width="2.2"/>
    <!-- 眼睛 -->
    <ellipse cx="20" cy="24" rx="2" ry="2.5" fill="currentColor"/>
    <ellipse cx="28" cy="24" rx="2" ry="2.5" fill="currentColor"/>
    <!-- 鼻子 -->
    <path d="M24 27 L22.5 29 L25.5 29 Z" fill="currentColor"/>
    <!-- 嘴巴 -->
    <path d="M22.5 29 Q24 32 25.5 29" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <!-- 胡须 -->
    <path d="M15 26 Q12 25 13 23" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M15 28 Q12 29 13 31" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M33 26 Q36 25 35 23" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M33 28 Q36 29 35 31" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  </symbol>

  <!-- ========== 设置 ========== -->
  <symbol id="icon-settings" viewBox="0 0 48 48">
    <!-- 齿轮，但用柔和线条 -->
    <circle cx="24" cy="24" r="7" fill="none" stroke="currentColor" stroke-width="2.2"/>
    <!-- 齿轮齿（圆角矩形） -->
    <rect x="22" y="4" width="4" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <rect x="22" y="36" width="4" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <rect x="4" y="22" width="8" height="4" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <rect x="36" y="22" width="8" height="4" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <!-- 斜角齿 -->
    <rect x="37.5" y="7.5" width="4" height="8" rx="2" transform="rotate(45 39.5 11.5)" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <rect x="6.5" y="32.5" width="4" height="8" rx="2" transform="rotate(45 8.5 36.5)" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <rect x="37.5" y="32.5" width="4" height="8" rx="2" transform="rotate(-45 39.5 36.5)" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <rect x="6.5" y="7.5" width="4" height="8" rx="2" transform="rotate(-45 8.5 11.5)" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <!-- 中心小圆 -->
    <circle cx="24" cy="24" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
  </symbol>

  <!-- ========== 爱心（疗愈核心图标） ========== -->
  <symbol id="icon-heart" viewBox="0 0 48 48">
    <!-- 手绘风格爱心 -->
    <path d="M24 42 Q10 32 10 20 Q10 10 18 10 Q22 10 24 14 Q26 10 30 10 Q38 10 38 20 Q38 32 24 42 Z"
          fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  </symbol>

  <!-- ========== 叶子 / 自然疗愈 ========== -->
  <symbol id="icon-leaf" viewBox="0 0 48 48">
    <!-- 一片叶子 -->
    <path d="M24 6 Q38 14 38 28 Q38 42 24 42 Q10 42 10 28 Q10 14 24 6 Z"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    <!-- 叶脉 -->
    <path d="M24 8 Q24 20 24 40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <!-- 侧脉 -->
    <path d="M24 16 Q32 12 34 8" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
    <path d="M24 24 Q34 20 36 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
    <path d="M24 16 Q16 12 14 8" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
    <path d="M24 24 Q16 20 14 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
  </symbol>

  <!-- ========== 星星 ========== -->
  <symbol id="icon-star" viewBox="0 0 48 48">
    <!-- 五角星，柔和线条 -->
    <path d="M24 4 L29 18 L44 18 L32 27 L36 42 L24 33 L12 42 L16 27 L4 18 L19 18 Z"
          fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  </symbol>

  <!-- ========== 太阳（光明/希望） ========== -->
  <symbol id="icon-sun" viewBox="0 0 48 48">
    <circle cx="24" cy="24" r="8" fill="none" stroke="currentColor" stroke-width="2.2"/>
    <!-- 光芒（柔和短线） -->
    <line x1="24" y1="6" x2="24" y2="12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="24" y1="36" x2="24" y2="42" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="6" y1="24" x2="12" y2="24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="36" y1="24" x2="42" y2="24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="11" y1="11" x2="15.5" y2="15.5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="32.5" y1="32.5" x2="37" y2="37" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="37" y1="11" x2="32.5" y2="15.5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="15.5" y1="32.5" x2="11" y2="37" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  </symbol>

  <!-- ========== 月亮（夜间疗愈） ========== -->
  <symbol id="icon-moon" viewBox="0 0 48 48">
    <!-- 弯月 -->
    <path d="M32 10 Q24 10 20 20 Q16 30 22 38 Q30 44 36 40 Q40 36 40 28 Q40 18 32 10 Z"
          fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- 内部小弧 -->
    <path d="M28 16 Q26 24 30 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
  </symbol>

  <!-- ========== 云朵（轻松/呼吸） ========== -->
  <symbol id="icon-cloud" viewBox="0 0 48 48">
    <path d="M14 34 Q8 32 8 26 Q8 20 14 20 Q14 12 22 12 Q28 6 36 10 Q42 10 42 18 Q48 18 42 24 Q44 32 38 34 Z"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
  </symbol>

  <!-- ========== 树（成长） ========== -->
  <symbol id="icon-tree" viewBox="0 0 48 48">
    <!-- 树冠（云朵状） -->
    <circle cx="24" cy="16" r="12" fill="none" stroke="currentColor" stroke-width="2"/>
    <!-- 第二层树冠 -->
    <circle cx="18" cy="22" r="8" fill="none" stroke="currentColor" stroke-width="1.8" opacity="0.7"/>
    <circle cx="30" cy="22" r="8" fill="none" stroke="currentColor" stroke-width="1.8" opacity="0.7"/>
    <!-- 树干 -->
    <path d="M21 28 L21 42 L27 42 L27 28 Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
  </symbol>

  <!-- ========== 花朵（绽放） ========== -->
  <symbol id="icon-flower" viewBox="0 0 48 48">
    <!-- 五片花瓣 -->
    <ellipse cx="24" cy="14" rx="5" ry="8" fill="none" stroke="currentColor" stroke-width="1.8" transform="rotate(0 24 24)"/>
    <ellipse cx="24" cy="14" rx="5" ry="8" fill="none" stroke="currentColor" stroke-width="1.8" transform="rotate(72 24 24)"/>
    <ellipse cx="24" cy="14" rx="5" ry="8" fill="none" stroke="currentColor" stroke-width="1.8" transform="rotate(144 24 24)"/>
    <ellipse cx="24" cy="14" rx="5" ry="8" fill="none" stroke="currentColor" stroke-width="1.8" transform="rotate(216 24 24)"/>
    <ellipse cx="24" cy="14" rx="5" ry="8" fill="none" stroke="currentColor" stroke-width="1.8" transform="rotate(288 24 24)"/>
    <!-- 花心 -->
    <circle cx="24" cy="24" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="24" cy="24" r="1.5" fill="currentColor" opacity="0.5"/>
    <!-- 茎 -->
    <path d="M24 28 Q22 36 24 44" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <!-- ========== 水波 / 呼吸练习 ========== -->
  <symbol id="icon-breathe" viewBox="0 0 48 48">
    <!-- 呼吸波纹 -->
    <ellipse cx="24" cy="24" rx="6" ry="12" fill="none" stroke="currentColor" stroke-width="2" opacity="0.5"/>
    <ellipse cx="24" cy="24" rx="11" ry="17" fill="none" stroke="currentColor" stroke-width="1.8" opacity="0.35"/>
    <ellipse cx="24" cy="24" rx="16" ry="21" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.2"/>
    <!-- 中心小圆 -->
    <circle cx="24" cy="24" r="3" fill="currentColor" opacity="0.6"/>
  </symbol>

  <!-- ========== 日记 / 情绪记录 ========== -->
  <symbol id="icon-journal" viewBox="0 0 48 48">
    <!-- 笔记本 -->
    <rect x="10" y="6" width="28" height="36" rx="3" fill="none" stroke="currentColor" stroke-width="2.2"/>
    <!-- 书脊 -->
    <line x1="16" y1="6" x2="16" y2="42" stroke="currentColor" stroke-width="2"/>
    <!-- 文字线 -->
    <line x1="20" y1="16" x2="36" y2="16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <line x1="20" y1="22" x2="34" y2="22" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <line x1="20" y1="28" x2="36" y2="28" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <line x1="20" y1="34" x2="30" y2="34" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  </symbol>

  <!-- ========== 播放（音频/冥想引导） ========== -->
  <symbol id="icon-play" viewBox="0 0 48 48">
    <circle cx="24" cy="24" r="18" fill="none" stroke="currentColor" stroke-width="2.2"/>
    <!-- 播放三角形 -->
    <path d="M19 14 L19 34 L36 24 Z" fill="currentColor" opacity="0.8"/>
  </symbol>

  <!-- ========== 暂停 ========== -->
  <symbol id="icon-pause" viewBox="0 0 48 48">
    <circle cx="24" cy="24" r="18" fill="none" stroke="currentColor" stroke-width="2.2"/>
    <rect x="17" y="14" width="4" height="20" rx="1.5" fill="currentColor" opacity="0.8"/>
    <rect x="27" y="14" width="4" height="20" rx="1.5" fill="currentColor" opacity="0.8"/>
  </symbol>

  <!-- ========== 饼干（猫咪消消乐道具） ========== -->
  <symbol id="icon-cookie" viewBox="0 0 48 48">
    <!-- 圆形饼干 -->
    <circle cx="24" cy="24" r="16" fill="none" stroke="currentColor" stroke-width="2.2"/>
    <!-- 饼干纹理（巧克力豆） -->
    <circle cx="18" cy="18" r="2.5" fill="currentColor" opacity="0.5"/>
    <circle cx="30" cy="20" r="2" fill="currentColor" opacity="0.5"/>
    <circle cx="22" cy="30" r="2.2" fill="currentColor" opacity="0.5"/>
    <circle cx="32" cy="32" r="1.8" fill="currentColor" opacity="0.5"/>
    <!-- 表面纹理 -->
    <path d="M16 24 Q20 22 24 24 Q28 26 32 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity="0.3"/>
  </symbol>

  <!-- ========== 炸弹（道具） ========== -->
  <symbol id="icon-bomb" viewBox="0 0 48 48">
    <circle cx="24" cy="28" r="13" fill="none" stroke="currentColor" stroke-width="2.2"/>
    <!-- 引线 -->
    <path d="M32 18 Q36 14 34 10 Q32 8 34 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <!-- 小火苗 -->
    <path d="M34 6 Q33 4 34 2 Q36 3 35 6" fill="currentColor" opacity="0.7"/>
    <!-- 表情 -->
    <circle cx="20" cy="26" r="1.8" fill="currentColor"/>
    <circle cx="28" cy="26" r="1.8" fill="currentColor"/>
    <path d="M21 32 Q24 35 27 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  </symbol>

  <!-- ========== 刷新 ========== -->
  <symbol id="icon-refresh" viewBox="0 0 48 48">
    <path d="M14 14 A16 16 0 1 1 20 36" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M14 14 L10 20 L20 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M34 34 A16 16 0 1 1 28 12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M34 34 L38 28 L28 30" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  </symbol>

  <!-- ========== 灯泡 / 提示 ========== -->
  <symbol id="icon-lightbulb" viewBox="0 0 48 48">
    <!-- 灯泡 -->
    <path d="M18 14 Q16 8 24 6 Q32 8 30 14 Q34 18 34 24 Q34 32 24 34 Q14 32 14 24 Q14 18 18 14 Z"
          fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- 灯座 -->
    <rect x="20" y="34" width="8" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="2"/>
    <rect x="19" y="38" width="10" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="2"/>
    <!-- 光线 -->
    <line x1="12" y1="10" x2="8" y2="6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity="0.4"/>
    <line x1="36" y1="10" x2="40" y2="6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity="0.4"/>
  </symbol>

  <!-- ========== 撒花 / 庆祝 ========== -->
  <symbol id="icon-confetti" viewBox="0 0 48 48">
    <!-- 彩带碎片 -->
    <rect x="12" y="8" width="6" height="3" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8" transform="rotate(-20 15 9.5)"/>
    <rect x="28" y="6" width="6" height="3" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8" transform="rotate(25 31 7.5)"/>
    <rect x="18" y="36" width="6" height="3" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8" transform="rotate(-15 21 37.5)"/>
    <rect x="32" y="32" width="6" height="3" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8" transform="rotate(20 35 33.5)"/>
    <!-- 圆形碎片 -->
    <circle cx="10" cy="24" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <circle cx="38" cy="22" r="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <circle cx="24" cy="42" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <!-- 中心星星 -->
    <path d="M24 14 L26 20 L32 20 L27 24 L29 30 L24 26 L19 30 L21 24 L16 20 L22 20 Z"
          fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
  </symbol>

  <!-- ========== 静音 ========== -->
  <symbol id="icon-speaker-x" viewBox="0 0 48 48">
    <!-- 喇叭 -->
    <path d="M8 18 L18 18 L30 8 L30 40 L18 30 L8 30 Z"
          fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- 禁止斜线 -->
    <line x1="34" y1="10" x2="42" y2="38" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  </symbol>

  <!-- ========== 声音 ========== -->
  <symbol id="icon-speaker" viewBox="0 0 48 48">
    <path d="M8 18 L18 18 L30 8 L30 40 L18 30 L8 30 Z"
          fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- 声波 -->
    <path d="M34 16 Q38 24 34 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <path d="M38 12 Q44 24 38 36" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <!-- ========== 禁止/关闭震动 ========== -->
  <symbol id="icon-prohibit" viewBox="0 0 48 48">
    <circle cx="24" cy="24" r="16" fill="none" stroke="currentColor" stroke-width="2.2"/>
    <line x1="14" y1="14" x2="34" y2="34" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  </symbol>

  <!-- ========== 返回首页 ========== -->

    <script>
    // ========= i18n 辅助函数 =========
    function _t(key, zhDefault) {
        if (!window.I18N) return zhDefault || key;
        if (I18N.currentLocale === "zh-CN") return zhDefault || key;
        return I18N.t(key) || zhDefault || key;
    }


    // ========== 全局状态 ==========
    let theories = [];
    let relationships = [];
    let currentFilter = 'all';
    let currentView = 'graph';
    let svg, g, zoomTransform = { k: 1, x: 0, y: 0 };

    // ========== 颜色映射（适配心晴空间色系） ==========
    const colorMap = {
        positive:   '#E07A5F',
        cognitive:  '#3D8B8B',
        clinical:   '#5B8DB8',
        motivation: '#D4A373'
    };
    // 分类/难度名称改为函数式，确保语言切换后取值正确
    function getCategoryName(cat) {
        const map = {
            positive:   _t('knowledge_graph.cat_positive', '积极心理学'),
            cognitive:  _t('knowledge_graph.cat_cognitive', '认知心理学'),
            clinical:   _t('knowledge_graph.cat_clinical', '临床治疗'),
            motivation: _t('knowledge_graph.cat_motivation', '动机与改变')
        };
        return map[cat] || cat;
    }
    function getDiffName(diff) {
        const map = {
            beginner:     _t('knowledge_graph.diff_beginner', '入门'),
            intermediate: _t('knowledge_graph.diff_intermediate', '进阶'),
            advanced:     _t('knowledge_graph.diff_advanced', '深入')
        };
        return map[diff] || diff;
    }
    const diffColors = {
        beginner:     '#10B981',
        intermediate: '#F59E0B',
        advanced:     '#8B5CF6'
    };

    // ========== 数据加载 ==========
    async function loadData() {
        const loadingEl = document.getElementById('loadingState');
        const errorEl = document.getElementById('errorState');

        try {
            // 根据当前语言选择数据文件
            const isEn = window.I18N && I18N.currentLocale === 'en';
            const graphDataFile = isEn ? '/data/graph-en.json' : '/data/graph.json';

            // 优先从 API 加载（Blob 存储）
            let data = null;
            try {
                const json = await Cache.cachedFetch('/api/knowledge/graph');
                data = { nodes: json.nodes || [], edges: json.edges || [] };
            } catch (apiErr) {
                console.log('API load failed, trying local fallback', apiErr);
            }

            // API 失败则降级到本地 JSON
            if (!data || !data.nodes.length) {
                data = await Cache.cachedFetch(graphDataFile);
            }

            if (!data || !data.nodes.length) {
                throw new Error('无可用数据');
            }

            theories = data.nodes;
            relationships = data.edges;

            loadingEl.style.display = 'none';
            document.getElementById('graphView').style.display = 'block';

            // 等待浏览器重排后再初始化（否则 wrapper 尺寸为 0）
            requestAnimationFrame(() => {
                // 初始化视图
                initGraph();
                renderCards();
                renderPath();
            });
        } catch (err) {
            console.error('数据加载失败:', err);
            loadingEl.style.display = 'none';
            errorEl.style.display = 'block';
        }
    }

    // ========== D3 图谱 ==========
    function initGraph() {
        const wrapper = document.querySelector('.graph-svg-wrapper');
        const w = wrapper.clientWidth;
        const h = wrapper.clientHeight;

        svg = d3.select('#graphSvg').attr('width', w).attr('height', h);

        const zoom = d3.zoom()
            .scaleExtent([0.3, 3])
            .on('zoom', e => {
                g.attr('transform', e.transform);
                zoomTransform = e.transform;
            });
        svg.call(zoom);

        g = svg.append('g');

        const sim = d3.forceSimulation(theories)
            .force('link', d3.forceLink(relationships).id(d => d.id).distance(120))
            .force('charge', d3.forceManyBody().strength(-400))
            .force('center', d3.forceCenter(w / 2, h / 2))
            .force('collide', d3.forceCollide().radius(55));

        const link = g.append('g')
            .selectAll('line')
            .data(relationships)
            .join('line')
            .attr('stroke', '#bbb')
            .attr('stroke-opacity', 0.5)
            .attr('stroke-width', 1.5);

        const linkLabel = g.append('g')
            .selectAll('text')
            .data(relationships)
            .join('text')
            .attr('class', 'link-label')
            .text(d => d.type)
            .attr('dy', -4);

        const node = g.append('g')
            .selectAll('g')
            .data(theories)
            .join('g')
            .call(d3.drag()
                .on('start', (e, d) => {
                    if (!e.active) sim.alphaTarget(0.3).restart();
                    d.fx = d.x;
                    d.fy = d.y;
                })
                .on('drag', (e, d) => {
                    d.fx = e.x;
                    d.fy = e.y;
                })
                .on('end', (e, d) => {
                    if (!e.active) sim.alphaTarget(0);
                    d.fx = null;
                    d.fy = null;
                }));

        node.append('circle')
            .attr('r', d => d.difficulty === 'beginner' ? 26 : d.difficulty === 'intermediate' ? 24 : 22)
            .attr('fill', d => colorMap[d.category])
            .attr('stroke', '#fff')
            .attr('stroke-width', 3)
            .attr('cursor', 'pointer')
            .on('mouseover', showTooltip)
            .on('mouseout', hideTooltip)
            .on('click', (e, d) => { e.stopPropagation(); openDetail(d); });

        node.append('text')
            .attr('class', 'node-label')
            .attr('dy', 4)
            .text(d => d.label);

        node.append('text')
            .attr('class', 'node-label')
            .attr('dy', 16)
            .attr('font-size', '9px')
            .attr('fill', '#666')
            .text(d => d.author);

        sim.on('tick', () => {
            link
                .attr('x1', d => d.source.x)
                .attr('y1', d => d.source.y)
                .attr('x2', d => d.target.x)
                .attr('y2', d => d.target.y);
            linkLabel
                .attr('x', d => (d.source.x + d.target.x) / 2)
                .attr('y', d => (d.source.y + d.target.y) / 2);
            node.attr('transform', d => `translate(${d.x},${d.y})`);
        });

        window.addEventListener('resize', () => {
            const wrapper = document.querySelector('.graph-svg-wrapper');
            const nw = wrapper.clientWidth;
            const nh = wrapper.clientHeight;
            svg.attr('width', nw).attr('height', nh);
            sim.force('center', d3.forceCenter(nw / 2, nh / 2));
            sim.alpha(0.3).restart();
        });
    }

    // ========== 缩放控制 ==========
    function zoomIn() {
        const wrapper = document.querySelector('.graph-svg-wrapper');
        const w = wrapper.clientWidth, h = wrapper.clientHeight;
        const t = d3.zoomIdentity.translate(w/2, h/2).scale(zoomTransform.k * 1.3).translate(-w/2, -h/2);
        d3.select('#graphSvg').transition().duration(300).call(d3.zoom().transform, t);
    }
    function zoomOut() {
        const wrapper = document.querySelector('.graph-svg-wrapper');
        const w = wrapper.clientWidth, h = wrapper.clientHeight;
        const t = d3.zoomIdentity.translate(w/2, h/2).scale(zoomTransform.k / 1.3).translate(-w/2, -h/2);
        d3.select('#graphSvg').transition().duration(300).call(d3.zoom().transform, t);
    }
    function resetZoom() {
        d3.select('#graphSvg').transition().duration(300).call(d3.zoom().transform, d3.zoomIdentity);
    }

    // ========== Tooltip ==========
    function showTooltip(e, d) {
        const t = document.getElementById('tooltip');
        t.innerHTML = `<strong>${d.label}</strong><span style="opacity:.8">${getCategoryName(d.category)} · ${getDiffName(d.difficulty)}</span><br/><span style="font-size:.8rem;opacity:.7">${d.author} (${d.year})</span>`;
        t.style.display = 'block';
        t.style.left = (e.clientX + 12) + 'px';
        t.style.top = (e.clientY - 12) + 'px';
    }
    function hideTooltip() {
        document.getElementById('tooltip').style.display = 'none';
    }

    // ========== 详情面板 ==========
    function openDetail(d) {
        const overlay = document.getElementById('detailOverlay');
        const sheet = document.getElementById('detailSheet');
        const header = document.getElementById('detailHeader');

        document.getElementById('detailCategory').textContent = getCategoryName(d.category) + ' · ' + getDiffName(d.difficulty);
        document.getElementById('detailTitle').textContent = d.label;
        document.getElementById('detailMeta').textContent = d.author + ' (' + d.year + ')';
        header.style.background = 'linear-gradient(135deg,' + (colorMap[d.category] || '#5A9A8A') + ' 0%,' + adjustColor(colorMap[d.category] || '#5A9A8A', -30) + ')';

        let html = '';
        html += `<div class="detail-section"><div class="detail-section-title"><svg class="icon icon--md"><use href="#icon-lightbulb"></use></svg> ${_t('knowledge_graph.section_core', '核心内容')}</div><p>${d.desc || ''}</p></div>`;
        if (d.examples && d.examples.length) {
            html += `<div class="detail-section"><div class="detail-section-title"><svg class="icon icon--md"><use href="#icon-heart"></use></svg> ${_t('knowledge_graph.section_examples', '生活例子')}</div><ul>${d.examples.map(ex => `<li>${ex}</li>`).join('')}</ul></div>`;
        }
        if (d.selfTest) {
            html += `<div class="detail-section"><div class="detail-section-title"><svg class="icon icon--md"><use href="#icon-journal"></use></svg> ${_t('knowledge_graph.section_selftest', '自我评估')}</div><p>${d.selfTest}</p></div>`;
        }
        if (d.practice) {
            html += `<div class="detail-section"><div class="detail-section-title"><svg class="icon icon--md"><use href="#icon-circle-check"></use></svg> ${_t('knowledge_graph.section_practice', '实践练习')}</div><p>${d.practice}</p></div>`;
        }

        const rels = relationships.filter(r => {
            const s = r.source.id || r.source;
            const t = r.target.id || r.target;
            return s === d.id || t === d.id;
        });
        if (rels.length) {
            html += `<div class="detail-section"><div class="detail-section-title"><svg class="icon icon--md"><use href="#icon-leaf"></use></svg> ${_t('knowledge_graph.section_related', '相关理论')}</div><ul>${rels.map(r => {
                const otherId = (r.source.id || r.source) === d.id ? (r.target.id || r.target) : (r.source.id || r.source);
                const otherNode = theories.find(t => t.id === otherId);
                return otherNode ? `<li><strong>${r.type} ${otherNode.label}</strong>：${r.desc || ''}</li>` : '';
            }).join('')}</ul></div>`;
        }

        if (d.links && d.links.length) {
            html += `<div class="detail-section"><div class="detail-section-title"><svg class="icon icon--md"><use href="#icon-globe"></use></svg> ${_t('knowledge_graph.section_resources', '权威资源')}</div><div class="detail-links">${d.links.map(l => `<a class="detail-link" href="${l.url}" target="_blank" rel="noopener"><div class="detail-link-icon"><svg class="icon icon--md"><use href="#icon-leaf"></use></svg></div><div class="detail-link-info"><div class="detail-link-name">${l.name}</div><div class="detail-link-url">${l.url}</div></div><div class="detail-link-arrow">›</div></a>`).join('')}</div></div>`;
        }

        document.getElementById('detailBody').innerHTML = html;
        overlay.classList.add('active');
        sheet.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeDetail() {
        document.getElementById('detailOverlay').classList.remove('active');
        document.getElementById('detailSheet').classList.remove('active');
        document.body.style.overflow = '';
    }

    function adjustColor(hex, amt) {
        let r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
        r = Math.max(0, Math.min(255, r + amt));
        g = Math.max(0, Math.min(255, g + amt));
        b = Math.max(0, Math.min(255, b + amt));
        return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
    }

    // ========== 卡片渲染 ==========
    function renderCards() {
        const grid = document.getElementById('cardsGrid');
        grid.innerHTML = '';
        theories.forEach(t => {
            if (currentFilter !== 'all' && t.category !== currentFilter) return;
            const card = document.createElement('div');
            card.className = 'knowledge-card';
            card.style.borderColor = (colorMap[t.category] || '#5A9A8A') + '30';
            card.innerHTML = `
                <div class="card-header" style="background:linear-gradient(135deg,${colorMap[t.category] || '#5A9A8A'} 0%,${adjustColor(colorMap[t.category] || '#5A9A8A', -30)});">
                    <div class="card-category-badge">${getCategoryName(t.category)}</div>
                    <div class="card-difficulty"><span style="width:8px;height:8px;border-radius:50%;background:${diffColors[t.difficulty] || '#ccc'};display:inline-block;"></span> ${getDiffName(t.difficulty)}</div>
                    <div class="card-title">${t.label}</div>
                    <div class="card-author">${t.author} (${t.year})</div>
                </div>
                <div class="card-body">
                    <div class="card-summary">${t.summary || ''}</div>
                    <div class="card-tags">
                        <span class="card-tag"><svg class="icon icon--md"><use href="#icon-journal"></use></svg> ${_t('knowledge_graph.tag_selftest', '自测')}</span>
                        <span class="card-tag"><svg class="icon icon--md"><use href="#icon-circle-check"></use></svg> ${_t('knowledge_graph.tag_practice', '练习')}</span>
                        <span class="card-tag">${_t('knowledge_graph.tag_resources', '{n} 个资源').replace('{n}', t.links ? t.links.length : 0)}</span>
                    </div>
                </div>`;
            card.onclick = () => openDetail(t);
            grid.appendChild(card);
        });
    }

    // ========== 路径渲染 ==========
    function renderPath() {
        const container = document.getElementById('pathStages');
        container.innerHTML = '';
        const stages = [
            { key: 'beginner', icon: '<svg class="icon icon--md"><use href="#icon-leaf"></use></svg>', title: _t('knowledge_graph.stage1_title', '第一阶段：入门基础'), desc: _t('knowledge_graph.stage1_desc', '建立核心概念，理解心理学基础框架') },
            { key: 'intermediate', icon: '<svg class="icon icon--md"><use href="#icon-leaf"></use></svg>', title: _t('knowledge_graph.stage2_title', '第二阶段：进阶理解'), desc: _t('knowledge_graph.stage2_desc', '深入核心理论，开始觉察自身模式') },
            { key: 'advanced', icon: '<svg class="icon icon--md"><use href="#icon-tree"></use></svg>', title: _t('knowledge_graph.stage3_title', '第三阶段：深入实践'), desc: _t('knowledge_graph.stage3_desc', '掌握复杂理论，整合应用于生活') }
        ];
        stages.forEach(stage => {
            const items = theories.filter(t => t.difficulty === stage.key).sort((a, b) => (a.order || 0) - (b.order || 0));
            if (currentFilter !== 'all') {
                const fitems = items.filter(t => t.category === currentFilter);
                if (!fitems.length) return;
            }
            const stageEl = document.createElement('div');
            stageEl.className = 'path-stage';
            let cardsHtml = '';
            items.forEach(t => {
                if (currentFilter !== 'all' && t.category !== currentFilter) return;
                cardsHtml += `<div class="path-card" onclick="openDetailById('${t.id}')"><div class="path-card-index" style="background:${colorMap[t.category] || '#5A9A8A'};">${t.order || ''}</div><div class="path-card-content"><div class="path-card-title">${t.label}</div><div class="path-card-desc">${t.summary || ''}</div></div></div>`;
            });
            stageEl.innerHTML = `<div class="path-stage-header"><div class="path-stage-icon">${stage.icon}</div><div><div class="path-stage-title">${stage.title}</div><div class="path-stage-desc">${stage.desc}</div></div></div><div class="path-cards">${cardsHtml}</div>`;
            container.appendChild(stageEl);
        });
    }

    function openDetailById(id) {
        const node = theories.find(t => t.id === id);
        if (node) openDetail(node);
    }

    // ========== 视图切换 ==========
    function switchView(view) {
        currentView = view;
        document.querySelectorAll('.view-tab').forEach(b => b.classList.toggle('active', b.dataset.view === view));
        document.getElementById('graphView').style.display = view === 'graph' ? 'block' : 'none';
        document.getElementById('cardsView').style.display = view === 'cards' ? 'block' : 'none';
        document.getElementById('pathView').style.display = view === 'path' ? 'block' : 'none';
        if (view === 'cards') renderCards();
        if (view === 'path') renderPath();
    }

    document.querySelectorAll('.view-tab').forEach(btn => {
        btn.addEventListener('click', () => switchView(btn.dataset.view));
    });

    // ========== 筛选 ==========
    document.querySelectorAll('.filter-chip').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentFilter = this.dataset.filter;
            if (currentView === 'cards') renderCards();
            if (currentView === 'path') renderPath();
            if (currentView === 'graph' && g) {
                const nodes = g.selectAll('g');
                const links = g.selectAll('line');
                const labels = g.selectAll('.link-label');
                if (currentFilter === 'all') {
                    nodes.style('opacity', 1);
                    links.style('opacity', 0.5);
                    labels.style('opacity', 1);
                } else {
                    nodes.style('opacity', d => d.category === currentFilter ? 1 : 0.15);
                    links.style('opacity', d => {
                        const sc = d.source.category || (d.source.id && theories.find(t => t.id === d.source.id)?.category);
                        const tc = d.target.category || (d.target.id && theories.find(t => t.id === d.target.id)?.category);
                        return sc === currentFilter || tc === currentFilter ? 0.5 : 0.1;
                    });
                    labels.style('opacity', d => {
                        const sc = d.source.category || (d.source.id && theories.find(t => t.id === d.source.id)?.category);
                        const tc = d.target.category || (d.target.id && theories.find(t => t.id === d.target.id)?.category);
                        return sc === currentFilter || tc === currentFilter ? 1 : 0.1;
                    });
                }
            }
        });
    });

    // ========== 移动端菜单 ==========
    function toggleMobileMenu() {
        const menu = document.getElementById('mobileMenu');
        menu.classList.toggle('open');
    }

    // ========== ESC 关闭详情 ==========
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeDetail();
    });

    // ========== 初始化 ==========
    document.addEventListener('DOMContentLoaded', () => {
        loadData();
        document.getElementById('detailSheet').addEventListener('click', e => e.stopPropagation());
    });
    </script>
