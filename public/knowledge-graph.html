<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>心理知识图谱 — 心晴空间</title>

    <meta name="description" content="探索积极心理学与认知心理学，可视化知识关联与个性化学习路径">
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 神经美学设计系统 -->
    <link rel="stylesheet" href="css/neuroaesthetics.css">
    <script src="js/cache.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/knowledge-graph.css">
    <style>
        /* 已提取到 css/knowledge-graph.css */
    </style>
</head>
<body>
    <!-- 导航栏（由 header.js 渲染） -->
    <div id="app-header"></div>

    <!-- ===== Hero 区域 ===== -->
    <section class="page-hero">
        <h1 data-i18n-html="knowledge_graph.hero_title">🧠 心理<span class="highlight">知识图谱</span></h1>
        <p data-i18n="knowledge_graph.hero_subtitle">探索积极心理学与认知心理学，从入门到深入。可视化知识关联，找到属于你的学习路径。</p>
    </section>

    <!-- ===== 工具栏 ===== -->
    <div class="toolbar">
        <div class="view-tabs">
            <button class="view-tab active" data-view="graph" data-i18n="knowledge_graph.tab_graph">🕸️ 知识图谱</button>
            <button class="view-tab" data-view="cards" data-i18n="knowledge_graph.tab_cards">🃏 卡片浏览</button>
            <button class="view-tab" data-view="path" data-i18n="knowledge_graph.tab_path">🛤️ 学习路径</button>
        </div>
        <div class="filter-group">
            <button class="filter-chip active" data-filter="all" data-i18n="knowledge_graph.filter_all"><span class="dot" style="background:var(--color-primary-400);"></span>全部</button>
            <button class="filter-chip" data-filter="positive" data-i18n="knowledge_graph.filter_positive"><span class="dot" style="background:#E07A5F;"></span>积极心理学</button>
            <button class="filter-chip" data-filter="cognitive" data-i18n="knowledge_graph.filter_cognitive"><span class="dot" style="background:#3D8B8B;"></span>认知心理学</button>
            <button class="filter-chip" data-filter="clinical" data-i18n="knowledge_graph.filter_clinical"><span class="dot" style="background:#5B8DB8;"></span>临床治疗</button>
            <button class="filter-chip" data-filter="motivation" data-i18n="knowledge_graph.filter_motivation"><span class="dot" style="background:#D4A373;"></span>动机与改变</button>
        </div>
    </div>

    <!-- ===== 主内容 ===== -->
    <div class="main-content">
        <!-- 加载状态 -->
        <div id="loadingState" class="loading-state">
            <div class="loading-spinner"></div>
            <p data-i18n="knowledge_graph.loading">正在加载知识图谱数据...</p>
        </div>

        <!-- 错误状态 -->
        <div id="errorState" class="empty-state" style="display:none;">
            <h3 data-i18n="knowledge_graph.error_title">数据加载失败</h3>
            <p data-i18n-html="knowledge_graph.error_desc">无法从服务器获取知识图谱数据。<br>请检查网络连接后刷新页面重试。</p>
        </div>

        <!-- 图谱视图 -->
        <div class="graph-view" id="graphView" style="display:none;">
            <div class="graph-container">
                <div class="graph-svg-wrapper">
                    <svg id="graphSvg"></svg>
                </div>
                <div class="graph-overlay-bar">
                    <div class="graph-legend">
                        <div class="legend-item"><div class="legend-color" style="background:#E07A5F;"></div><span data-i18n="knowledge_graph.filter_positive">积极心理学</span></div>
                        <div class="legend-item"><div class="legend-color" style="background:#3D8B8B;"></div><span data-i18n="knowledge_graph.filter_cognitive">认知心理学</span></div>
                        <div class="legend-item"><div class="legend-color" style="background:#5B8DB8;"></div><span data-i18n="knowledge_graph.filter_clinical">临床治疗</span></div>
                        <div class="legend-item"><div class="legend-color" style="background:#D4A373;"></div><span data-i18n="knowledge_graph.filter_motivation">动机与改变</span></div>
                    </div>
                    <div class="graph-controls">
                        <button class="graph-btn" onclick="zoomIn()" title="放大">+</button>
                        <button class="graph-btn" onclick="zoomOut()" title="缩小">−</button>
                        <button class="graph-btn" onclick="resetZoom()" title="重置">⟲</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 卡片视图 -->
        <div class="cards-view" id="cardsView" style="display:none;">
            <div class="cards-grid" id="cardsGrid"></div>
        </div>

        <!-- 路径视图 -->
        <div class="path-view" id="pathView" style="display:none;">
            <div class="path-intro">
                <h2 data-i18n-html="knowledge_graph.path_intro_title">🎯 循序渐进学习心理学</h2>
                <p data-i18n="knowledge_graph.path_intro_desc">从基础概念入手，逐步深入核心理论，最后掌握实践方法。建议按阶段顺序学习，每个阶段掌握后再进入下一阶段。</p>
            </div>
            <div id="pathStages"></div>
        </div>
    </div>

    <!-- ===== 详情面板 ===== -->
    <div class="detail-overlay" id="detailOverlay" onclick="closeDetail()"></div>
    <div class="detail-sheet" id="detailSheet">
        <div class="detail-sheet-handle"></div>
        <div class="detail-header" id="detailHeader">
            <button class="detail-close" onclick="closeDetail()">×</button>
            <div class="detail-category" id="detailCategory"></div>
            <div class="detail-title" id="detailTitle"></div>
            <div class="detail-meta" id="detailMeta"></div>
        </div>
        <div class="detail-body" id="detailBody"></div>
    </div>

    <!-- Tooltip -->
    <div class="tooltip" id="tooltip"></div>

    <!-- D3.js -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <!-- 神经美学交互引擎 -->
    <script src="js/neuroaesthetics.js"></script>
    <script src="js/theme-manager.js"></script>
    <script src="js/i18n.js"></script>

    <script>
    // ========= i18n 辅助函数 =========
    function _t(key, zhDefault) {
        if (!window.I18N) return zhDefault || key;
        if (I18N.currentLocale === "zh-CN") return zhDefault || key;
        return I18N.t(key) || zhDefault || key;
    }


    // ========== 全局状态 ==========
    let theories = [];
    let relationships = [];
    let currentFilter = 'all';
    let currentView = 'graph';
    let svg, g, zoomTransform = { k: 1, x: 0, y: 0 };

    // ========== 颜色映射（适配心晴空间色系） ==========
    const colorMap = {
        positive:   '#E07A5F',
        cognitive:  '#3D8B8B',
        clinical:   '#5B8DB8',
        motivation: '#D4A373'
    };
    // 分类/难度名称改为函数式，确保语言切换后取值正确
    function getCategoryName(cat) {
        const map = {
            positive:   _t('knowledge_graph.cat_positive', '积极心理学'),
            cognitive:  _t('knowledge_graph.cat_cognitive', '认知心理学'),
            clinical:   _t('knowledge_graph.cat_clinical', '临床治疗'),
            motivation: _t('knowledge_graph.cat_motivation', '动机与改变')
        };
        return map[cat] || cat;
    }
    function getDiffName(diff) {
        const map = {
            beginner:     _t('knowledge_graph.diff_beginner', '入门'),
            intermediate: _t('knowledge_graph.diff_intermediate', '进阶'),
            advanced:     _t('knowledge_graph.diff_advanced', '深入')
        };
        return map[diff] || diff;
    }
    const diffColors = {
        beginner:     '#10B981',
        intermediate: '#F59E0B',
        advanced:     '#8B5CF6'
    };

    // ========== 数据加载 ==========
    async function loadData() {
        const loadingEl = document.getElementById('loadingState');
        const errorEl = document.getElementById('errorState');

        try {
            // 根据当前语言选择数据文件
            const isEn = window.I18N && I18N.currentLocale === 'en';
            const graphDataFile = isEn ? '/data/graph-en.json' : '/data/graph.json';

            // 优先从 API 加载（Blob 存储）
            let data = null;
            try {
                const json = await Cache.cachedFetch('/api/knowledge/graph');
                data = { nodes: json.nodes || [], edges: json.edges || [] };
            } catch (apiErr) {
                console.log('API load failed, trying local fallback', apiErr);
            }

            // API 失败则降级到本地 JSON
            if (!data || !data.nodes.length) {
                data = await Cache.cachedFetch(graphDataFile);
            }

            if (!data || !data.nodes.length) {
                throw new Error('无可用数据');
            }

            theories = data.nodes;
            relationships = data.edges;

            loadingEl.style.display = 'none';
            document.getElementById('graphView').style.display = 'block';

            // 初始化视图
            initGraph();
            renderCards();
            renderPath();
        } catch (err) {
            console.error('数据加载失败:', err);
            loadingEl.style.display = 'none';
            errorEl.style.display = 'block';
        }
    }

    // ========== D3 图谱 ==========
    function initGraph() {
        const wrapper = document.querySelector('.graph-svg-wrapper');
        const w = wrapper.clientWidth;
        const h = wrapper.clientHeight;

        svg = d3.select('#graphSvg').attr('width', w).attr('height', h);

        const zoom = d3.zoom()
            .scaleExtent([0.3, 3])
            .on('zoom', e => {
                g.attr('transform', e.transform);
                zoomTransform = e.transform;
            });
        svg.call(zoom);

        g = svg.append('g');

        const sim = d3.forceSimulation(theories)
            .force('link', d3.forceLink(relationships).id(d => d.id).distance(120))
            .force('charge', d3.forceManyBody().strength(-400))
            .force('center', d3.forceCenter(w / 2, h / 2))
            .force('collide', d3.forceCollide().radius(55));

        const link = g.append('g')
            .selectAll('line')
            .data(relationships)
            .join('line')
            .attr('stroke', '#bbb')
            .attr('stroke-opacity', 0.5)
            .attr('stroke-width', 1.5);

        const linkLabel = g.append('g')
            .selectAll('text')
            .data(relationships)
            .join('text')
            .attr('class', 'link-label')
            .text(d => d.type)
            .attr('dy', -4);

        const node = g.append('g')
            .selectAll('g')
            .data(theories)
            .join('g')
            .call(d3.drag()
                .on('start', (e, d) => {
                    if (!e.active) sim.alphaTarget(0.3).restart();
                    d.fx = d.x;
                    d.fy = d.y;
                })
                .on('drag', (e, d) => {
                    d.fx = e.x;
                    d.fy = e.y;
                })
                .on('end', (e, d) => {
                    if (!e.active) sim.alphaTarget(0);
                    d.fx = null;
                    d.fy = null;
                }));

        node.append('circle')
            .attr('r', d => d.difficulty === 'beginner' ? 26 : d.difficulty === 'intermediate' ? 24 : 22)
            .attr('fill', d => colorMap[d.category])
            .attr('stroke', '#fff')
            .attr('stroke-width', 3)
            .attr('cursor', 'pointer')
            .on('mouseover', showTooltip)
            .on('mouseout', hideTooltip)
            .on('click', (e, d) => { e.stopPropagation(); openDetail(d); });

        node.append('text')
            .attr('class', 'node-label')
            .attr('dy', 4)
            .text(d => d.label);

        node.append('text')
            .attr('class', 'node-label')
            .attr('dy', 16)
            .attr('font-size', '9px')
            .attr('fill', '#666')
            .text(d => d.author);

        sim.on('tick', () => {
            link
                .attr('x1', d => d.source.x)
                .attr('y1', d => d.source.y)
                .attr('x2', d => d.target.x)
                .attr('y2', d => d.target.y);
            linkLabel
                .attr('x', d => (d.source.x + d.target.x) / 2)
                .attr('y', d => (d.source.y + d.target.y) / 2);
            node.attr('transform', d => `translate(${d.x},${d.y})`);
        });

        window.addEventListener('resize', () => {
            const wrapper = document.querySelector('.graph-svg-wrapper');
            const nw = wrapper.clientWidth;
            const nh = wrapper.clientHeight;
            svg.attr('width', nw).attr('height', nh);
            sim.force('center', d3.forceCenter(nw / 2, nh / 2));
            sim.alpha(0.3).restart();
        });
    }

    // ========== 缩放控制 ==========
    function zoomIn() {
        const wrapper = document.querySelector('.graph-svg-wrapper');
        const w = wrapper.clientWidth, h = wrapper.clientHeight;
        const t = d3.zoomIdentity.translate(w/2, h/2).scale(zoomTransform.k * 1.3).translate(-w/2, -h/2);
        d3.select('#graphSvg').transition().duration(300).call(d3.zoom().transform, t);
    }
    function zoomOut() {
        const wrapper = document.querySelector('.graph-svg-wrapper');
        const w = wrapper.clientWidth, h = wrapper.clientHeight;
        const t = d3.zoomIdentity.translate(w/2, h/2).scale(zoomTransform.k / 1.3).translate(-w/2, -h/2);
        d3.select('#graphSvg').transition().duration(300).call(d3.zoom().transform, t);
    }
    function resetZoom() {
        d3.select('#graphSvg').transition().duration(300).call(d3.zoom().transform, d3.zoomIdentity);
    }

    // ========== Tooltip ==========
    function showTooltip(e, d) {
        const t = document.getElementById('tooltip');
        t.innerHTML = `<strong>${d.label}</strong><span style="opacity:.8">${getCategoryName(d.category)} · ${getDiffName(d.difficulty)}</span><br/><span style="font-size:.8rem;opacity:.7">${d.author} (${d.year})</span>`;
        t.style.display = 'block';
        t.style.left = (e.clientX + 12) + 'px';
        t.style.top = (e.clientY - 12) + 'px';
    }
    function hideTooltip() {
        document.getElementById('tooltip').style.display = 'none';
    }

    // ========== 详情面板 ==========
    function openDetail(d) {
        const overlay = document.getElementById('detailOverlay');
        const sheet = document.getElementById('detailSheet');
        const header = document.getElementById('detailHeader');

        document.getElementById('detailCategory').textContent = getCategoryName(d.category) + ' · ' + getDiffName(d.difficulty);
        document.getElementById('detailTitle').textContent = d.label;
        document.getElementById('detailMeta').textContent = d.author + ' (' + d.year + ')';
        header.style.background = 'linear-gradient(135deg,' + (colorMap[d.category] || '#5A9A8A') + ' 0%,' + adjustColor(colorMap[d.category] || '#5A9A8A', -30) + ')';

        let html = '';
        html += `<div class="detail-section"><div class="detail-section-title">${_t('knowledge_graph.section_core', '💡 核心内容')}</div><p>${d.desc || ''}</p></div>`;
        if (d.examples && d.examples.length) {
            html += `<div class="detail-section"><div class="detail-section-title">${_t('knowledge_graph.section_examples', '💬 生活例子')}</div><ul>${d.examples.map(ex => `<li>${ex}</li>`).join('')}</ul></div>`;
        }
        if (d.selfTest) {
            html += `<div class="detail-section"><div class="detail-section-title">${_t('knowledge_graph.section_selftest', '📋 自我评估')}</div><p>${d.selfTest}</p></div>`;
        }
        if (d.practice) {
            html += `<div class="detail-section"><div class="detail-section-title">${_t('knowledge_graph.section_practice', '🎯 实践练习')}</div><p>${d.practice}</p></div>`;
        }

        const rels = relationships.filter(r => {
            const s = r.source.id || r.source;
            const t = r.target.id || r.target;
            return s === d.id || t === d.id;
        });
        if (rels.length) {
            html += `<div class="detail-section"><div class="detail-section-title">${_t('knowledge_graph.section_related', '🔗 相关理论')}</div><ul>${rels.map(r => {
                const otherId = (r.source.id || r.source) === d.id ? (r.target.id || r.target) : (r.source.id || r.source);
                const otherNode = theories.find(t => t.id === otherId);
                return otherNode ? `<li><strong>${r.type} ${otherNode.label}</strong>：${r.desc || ''}</li>` : '';
            }).join('')}</ul></div>`;
        }

        if (d.links && d.links.length) {
            html += `<div class="detail-section"><div class="detail-section-title">${_t('knowledge_graph.section_resources', '🌐 权威资源')}</div><div class="detail-links">${d.links.map(l => `<a class="detail-link" href="${l.url}" target="_blank" rel="noopener"><div class="detail-link-icon">🔗</div><div class="detail-link-info"><div class="detail-link-name">${l.name}</div><div class="detail-link-url">${l.url}</div></div><div class="detail-link-arrow">›</div></a>`).join('')}</div></div>`;
        }

        document.getElementById('detailBody').innerHTML = html;
        overlay.classList.add('active');
        sheet.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeDetail() {
        document.getElementById('detailOverlay').classList.remove('active');
        document.getElementById('detailSheet').classList.remove('active');
        document.body.style.overflow = '';
    }

    function adjustColor(hex, amt) {
        let r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
        r = Math.max(0, Math.min(255, r + amt));
        g = Math.max(0, Math.min(255, g + amt));
        b = Math.max(0, Math.min(255, b + amt));
        return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
    }

    // ========== 卡片渲染 ==========
    function renderCards() {
        const grid = document.getElementById('cardsGrid');
        grid.innerHTML = '';
        theories.forEach(t => {
            if (currentFilter !== 'all' && t.category !== currentFilter) return;
            const card = document.createElement('div');
            card.className = 'knowledge-card';
            card.style.borderColor = (colorMap[t.category] || '#5A9A8A') + '30';
            card.innerHTML = `
                <div class="card-header" style="background:linear-gradient(135deg,${colorMap[t.category] || '#5A9A8A'} 0%,${adjustColor(colorMap[t.category] || '#5A9A8A', -30)});">
                    <div class="card-category-badge">${getCategoryName(t.category)}</div>
                    <div class="card-difficulty"><span style="width:8px;height:8px;border-radius:50%;background:${diffColors[t.difficulty] || '#ccc'};display:inline-block;"></span> ${getDiffName(t.difficulty)}</div>
                    <div class="card-title">${t.label}</div>
                    <div class="card-author">${t.author} (${t.year})</div>
                </div>
                <div class="card-body">
                    <div class="card-summary">${t.summary || ''}</div>
                    <div class="card-tags">
                        <span class="card-tag">${_t('knowledge_graph.tag_selftest', '📋 自测')}</span>
                        <span class="card-tag">${_t('knowledge_graph.tag_practice', '🎯 练习')}</span>
                        <span class="card-tag">${_t('knowledge_graph.tag_resources', '{n} 个资源').replace('{n}', t.links ? t.links.length : 0)}</span>
                    </div>
                </div>`;
            card.onclick = () => openDetail(t);
            grid.appendChild(card);
        });
    }

    // ========== 路径渲染 ==========
    function renderPath() {
        const container = document.getElementById('pathStages');
        container.innerHTML = '';
        const stages = [
            { key: 'beginner', icon: '🌱', title: _t('knowledge_graph.stage1_title', '第一阶段：入门基础'), desc: _t('knowledge_graph.stage1_desc', '建立核心概念，理解心理学基础框架') },
            { key: 'intermediate', icon: '🌿', title: _t('knowledge_graph.stage2_title', '第二阶段：进阶理解'), desc: _t('knowledge_graph.stage2_desc', '深入核心理论，开始觉察自身模式') },
            { key: 'advanced', icon: '🌳', title: _t('knowledge_graph.stage3_title', '第三阶段：深入实践'), desc: _t('knowledge_graph.stage3_desc', '掌握复杂理论，整合应用于生活') }
        ];
        stages.forEach(stage => {
            const items = theories.filter(t => t.difficulty === stage.key).sort((a, b) => (a.order || 0) - (b.order || 0));
            if (currentFilter !== 'all') {
                const fitems = items.filter(t => t.category === currentFilter);
                if (!fitems.length) return;
            }
            const stageEl = document.createElement('div');
            stageEl.className = 'path-stage';
            let cardsHtml = '';
            items.forEach(t => {
                if (currentFilter !== 'all' && t.category !== currentFilter) return;
                cardsHtml += `<div class="path-card" onclick="openDetailById('${t.id}')"><div class="path-card-index" style="background:${colorMap[t.category] || '#5A9A8A'};">${t.order || ''}</div><div class="path-card-content"><div class="path-card-title">${t.label}</div><div class="path-card-desc">${t.summary || ''}</div></div></div>`;
            });
            stageEl.innerHTML = `<div class="path-stage-header"><div class="path-stage-icon">${stage.icon}</div><div><div class="path-stage-title">${stage.title}</div><div class="path-stage-desc">${stage.desc}</div></div></div><div class="path-cards">${cardsHtml}</div>`;
            container.appendChild(stageEl);
        });
    }

    function openDetailById(id) {
        const node = theories.find(t => t.id === id);
        if (node) openDetail(node);
    }

    // ========== 视图切换 ==========
    function switchView(view) {
        currentView = view;
        document.querySelectorAll('.view-tab').forEach(b => b.classList.toggle('active', b.dataset.view === view));
        document.getElementById('graphView').style.display = view === 'graph' ? 'block' : 'none';
        document.getElementById('cardsView').style.display = view === 'cards' ? 'block' : 'none';
        document.getElementById('pathView').style.display = view === 'path' ? 'block' : 'none';
        if (view === 'cards') renderCards();
        if (view === 'path') renderPath();
    }

    document.querySelectorAll('.view-tab').forEach(btn => {
        btn.addEventListener('click', () => switchView(btn.dataset.view));
    });

    // ========== 筛选 ==========
    document.querySelectorAll('.filter-chip').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentFilter = this.dataset.filter;
            if (currentView === 'cards') renderCards();
            if (currentView === 'path') renderPath();
            if (currentView === 'graph' && g) {
                const nodes = g.selectAll('g');
                const links = g.selectAll('line');
                const labels = g.selectAll('.link-label');
                if (currentFilter === 'all') {
                    nodes.style('opacity', 1);
                    links.style('opacity', 0.5);
                    labels.style('opacity', 1);
                } else {
                    nodes.style('opacity', d => d.category === currentFilter ? 1 : 0.15);
                    links.style('opacity', d => {
                        const sc = d.source.category || (d.source.id && theories.find(t => t.id === d.source.id)?.category);
                        const tc = d.target.category || (d.target.id && theories.find(t => t.id === d.target.id)?.category);
                        return sc === currentFilter || tc === currentFilter ? 0.5 : 0.1;
                    });
                    labels.style('opacity', d => {
                        const sc = d.source.category || (d.source.id && theories.find(t => t.id === d.source.id)?.category);
                        const tc = d.target.category || (d.target.id && theories.find(t => t.id === d.target.id)?.category);
                        return sc === currentFilter || tc === currentFilter ? 1 : 0.1;
                    });
                }
            }
        });
    });

    // ========== 移动端菜单 ==========
    function toggleMobileMenu() {
        const menu = document.getElementById('mobileMenu');
        menu.classList.toggle('open');
    }

    // ========== ESC 关闭详情 ==========
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeDetail();
    });

    // ========== 初始化 ==========
    document.addEventListener('DOMContentLoaded', () => {
        loadData();
        document.getElementById('detailSheet').addEventListener('click', e => e.stopPropagation());
    });
    </script>

    <div id="app-footer"></div>

    <!-- 通用导航栏组件 -->
    <script src="js/components/header.js"></script>
    <script>
      renderHeader({ currentPage: 'knowledge-graph' });
    </script>
    <!-- 通用页脚组件 -->
    <script src="js/components/footer.js"></script>
    <script>
      renderFooter();
    </script>
</body>
</html>
